<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Formules en 2 colonnes — Liaisons chimiques et orbitales moléculaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--ink:#1d2330;--muted:#5b6474;--line:#e3e6ec;--frame:#b9c0cc;--star:#e8a900;--starbg:#fff6d6;--ded:#3f9a6a;
--A:#2f86a8;--B:#d0632e;--C:#c9971c;--D:#6f5aa8;--E:#a64b4b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181f;--ink:#e7eaf0;--muted:#9aa3b2;--line:#2b313d;--frame:#4a5263;--starbg:#3a300f}}
:root[data-theme="dark"]{--bg:#15181f;--ink:#e7eaf0;--muted:#9aa3b2;--line:#2b313d;--frame:#4a5263;--starbg:#3a300f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
.wrap{max-width:820px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:1.4rem;margin:0 0 10px;font-weight:800}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 8px;z-index:2;display:flex;gap:8px;align-items:center}
.bar button{font:inherit;font-size:.9rem;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--starbg);border-color:var(--star)}
.bar button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.bar span{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;border:2px solid var(--frame)}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:700;padding:6px 10px;border-bottom:2px solid var(--frame)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.d{width:42%;font-weight:700;font-size:.95rem;border-right:1.5px solid var(--frame)}
td.d .s{color:var(--star);font-size:.8rem;margin-left:4px;white-space:nowrap}
td.f{font-family:"STIX Two Text",Georgia,serif;font-weight:700;font-size:1.12rem}
td.f .u{display:block;font-family:"Source Sans 3",system-ui,sans-serif;font-weight:600;font-size:.82rem;color:var(--muted);margin-top:2px}
td.f .u b{color:var(--ink)}
tr.sec td{background:var(--c);color:#fff;font-weight:800;font-size:.95rem;padding:6px 10px;border-bottom:0}
tr.der td.d{padding-left:24px;color:var(--ded);font-weight:600;font-size:.9rem}
tr.der td.d::before{content:"↳ ";font-weight:800}
tr.der td.f{font-size:1rem;color:var(--ded)}
sub{font-size:.65em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}
.frac>span{padding:0 .25em}
.frac>span:first-child{border-bottom:2px solid currentColor}
body.hide td.f .ft,body.hide td.f .u{filter:blur(7px)}
body.hide tr:not(.sec){cursor:pointer}
body.hide tr.show td.f .ft,body.hide tr.show td.f .u{filter:none}
@media (prefers-reduced-motion:no-preference){.ft,.u{transition:filter .2s}}
@media (max-width:480px){td{padding:8px 7px}td.d{font-size:.88rem}td.f{font-size:1rem}tr.der td.d{padding-left:16px}}
@media print{.bar{display:none}body.hide .ft,body.hide .u{filter:none}tr{break-inside:avoid}}

/* ---- Mise en page soignée ---- */
body{background:color-mix(in srgb,var(--bg) 94%,#8ea0c0)}
.wrap{max-width:860px;padding:22px 14px 50px}
.top{padding:4px 2px 6px}
.kicker{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.top h1{font-size:1.9rem;margin:2px 0 4px;letter-spacing:-.01em}
.meta{margin:0;font-size:.88rem;color:var(--muted)}
.meta .s{color:var(--star)} .meta .g{color:var(--ded);font-weight:800}
.bar{background:color-mix(in srgb,var(--bg) 94%,#8ea0c0);padding:10px 0}
.bar button{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cols{display:grid;grid-template-columns:42% 58%;font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--muted);padding:4px 16px 6px}
.blk{background:var(--bg);border-radius:16px;margin:0 0 22px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px -12px rgba(20,30,50,.25);border:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}
.blk header{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;font-size:1.02rem;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--bg));border-bottom:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}
.letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-size:.95rem}
.row{display:grid;grid-template-columns:42% 58%;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{padding:12px 12px 12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.code{font-size:.72rem;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg));border-radius:5px;padding:1px 6px}
.name{font-weight:700;font-size:.95rem;flex-basis:100%}
.row .d .s{color:var(--star);font-size:.82rem;letter-spacing:1px}
.row .f{padding:12px 16px;background:color-mix(in srgb,var(--c) 5%,var(--bg));border-left:1px solid color-mix(in srgb,var(--c) 20%,var(--line));display:flex;flex-direction:column;justify-content:center;font-family:"STIX Two Text",Georgia,serif;font-weight:700;font-size:1.2rem}
.row .f .u{align-self:flex-start;margin-top:6px;font-family:"Source Sans 3",system-ui,sans-serif;font-weight:600;font-size:.78rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;line-height:1.3}
.row .f .u b{color:var(--c)}
.row.star .d{background:linear-gradient(90deg,var(--starbg),transparent 75%)}
.row.der .d{padding-left:30px;position:relative}
.row.der .d::before{content:"↳";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ded);font-weight:800}
.row.der .name{color:var(--ded);font-weight:600;font-size:.9rem}
.row.der .code{color:var(--ded);background:color-mix(in srgb,var(--ded) 12%,var(--bg))}
.row.der .f{font-size:1.05rem;color:var(--ded);background:color-mix(in srgb,var(--ded) 6%,var(--bg))}
body.hide .ft,body.hide .u{filter:blur(7px);user-select:none}
body.hide .row{cursor:pointer}
body.hide .row.show .ft,body.hide .row.show .u{filter:none}
.row:focus-visible{outline:3px solid var(--star);outline-offset:-3px}
@media (max-width:480px){
  .cols,.row{grid-template-columns:44% 56%}
  .row .d{padding:10px 8px 10px 12px}.row .f{padding:10px 12px;font-size:1.05rem}
  .name{font-size:.88rem}.row.der .d{padding-left:24px}.row.der .d::before{left:8px}
  .top h1{font-size:1.6rem}
}
@media print{body{background:#fff}.blk{box-shadow:none;break-inside:avoid}}


/* Option 1 : groupe encadré (formule mère + filles dans une bande verte) */
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp > .row{border-top:0}
.kids{background:color-mix(in srgb,var(--ded) 13%,var(--bg));padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-top:1px solid color-mix(in srgb,var(--ded) 30%,var(--line))}
.kids .row{border:1px solid color-mix(in srgb,var(--ded) 30%,var(--line));border-radius:10px;overflow:hidden;background:var(--bg);grid-template-columns:calc(42% - 4px) auto}
.kids .row .d{padding:9px 10px}
.kids .row .f{background:color-mix(in srgb,var(--ded) 5%,var(--bg));border-left:1px solid color-mix(in srgb,var(--ded) 25%,var(--line))}
.row.der .d{padding-left:10px}
.row.der .d::before{content:none}
@media (max-width:480px){.kids{padding:7px 7px 8px}.kids .row .d{padding:8px}}

/* Formules déduites : mêmes couleurs que les autres (seul le regroupement les distingue) */
.kids{background:color-mix(in srgb,var(--ink) 5%,var(--bg));border-top:1px solid var(--line)}
.kids .row{border-color:var(--line)}
.row.der .name{color:var(--ink);font-weight:700;font-size:.95rem}
.row.der .code{color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg))}
.row.der .code::before{content:none}
.row.der .f,.kids .row .f{color:var(--ink);font-size:1.2rem;background:color-mix(in srgb,var(--c) 5%,var(--bg));border-left:1px solid color-mix(in srgb,var(--c) 20%,var(--line))}
@media (max-width:480px){.row.der .f,.kids .row .f{font-size:1.05rem}.row.der .name{font-size:.88rem}}

/* Comme la page explication : filles décalées, reliées par un trait à leur formule mère */
.kids{background:transparent;border-top:0;padding:0 12px 14px 38px;gap:10px;position:relative}
.kids .row{position:relative;overflow:visible;border:1.5px solid color-mix(in srgb,var(--ded) 60%,var(--line));border-radius:10px;background:var(--bg)}
.kids .row .d{border-radius:9px 0 0 9px}
.kids .row .f{border-radius:0 9px 9px 0}
.kids .row::before{content:"";position:absolute;left:-24px;top:-12px;bottom:-12px;border-left:2px solid var(--ded)}
.kids .row:first-child::before{top:-2px}
.kids .row:last-child::before{bottom:50%}
.kids .row::after{content:"";position:absolute;left:-24px;top:50%;width:22px;border-top:2px solid var(--ded)}
.grp:has(.kids) > .row{border-bottom:0}
.from{flex-basis:100%;font-size:.76rem;font-weight:700;color:var(--ded)}
.from b{font-weight:800}
@media (max-width:480px){
  .kids{padding:0 8px 12px 28px}
  .kids .row::before,.kids .row::after{left:-18px}
  .kids .row::after{width:16px}
}

/* Colonnes alignées partout + petit espace entre formules principales + cadres déduits plus étroits */
.blk{container-type:inline-size}
.row{grid-template-columns:42cqw minmax(0,1fr)!important}
.kids .row{grid-template-columns:calc(42cqw - 39.5px) minmax(0,1fr)!important}
.cols{grid-template-columns:42% 58%}
.rows{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.grp{border-top:0!important;background:var(--bg)}
.kids{padding:0 34px 14px 38px}
@media (max-width:480px){
  .kids{padding:0 22px 12px 38px}
  .kids .row::before,.kids .row::after{left:-24px}
  .kids .row::after{width:22px}
}
.from{white-space:nowrap;font-size:.7rem}
@media (max-width:480px){.kids .row .d{padding:8px 6px 8px 8px}}

/* Tableau neutre (mode singe) : sans sections, sans codes, sans étoiles, mélangé */
.neutral{--c:var(--muted);border-color:var(--line)}
.neutral .row .f{background:color-mix(in srgb,var(--ink) 4%,var(--bg));border-left:1px solid var(--line)}
.neutral .row .u b{color:var(--ink)}
.neutral .row .u [style]{color:inherit!important}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.qbar button{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
[hidden]{display:none!important}
body.hide .meta{display:none}

/* ---- Mode entraînement (singe) ---- */
.qhead{background:var(--bg);border-radius:16px;padding:14px 16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px -12px rgba(20,30,50,.25)}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.qtitle{font-weight:800;font-size:1.1rem}
.qcount{font-size:.85rem;color:var(--muted);font-weight:600}
.prog{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));margin:10px 0 12px;overflow:hidden}
.prog span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f5c542,var(--star));transition:width .3s}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtns button{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.qlist{display:flex;flex-direction:column;gap:10px;container-type:inline-size}
.qc{display:grid;grid-template-columns:42cqw minmax(0,1fr);background:var(--bg);border-radius:14px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,50,.05),0 6px 16px -10px rgba(20,30,50,.3);transition:transform .15s}
.qc:active{transform:scale(.99)}
.qc:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.qc.star{border-color:color-mix(in srgb,var(--star) 45%,var(--line))}
.qd{padding:12px 12px 12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.qc.star .qd{background:linear-gradient(90deg,var(--starbg),transparent 85%)}
.qn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));color:var(--muted);font-size:.75rem;font-weight:800}
.qs{color:var(--star);font-size:.85rem;letter-spacing:1px}
.qq{flex-basis:100%;font-weight:700;font-size:.95rem}
.qf{position:relative;padding:12px 14px;background:color-mix(in srgb,var(--ink) 3.5%,var(--bg));border-left:1px solid var(--line);display:flex;align-items:center;font-family:"STIX Two Text",Georgia,serif;font-weight:700;font-size:1.15rem}
.qans{display:flex;flex-direction:column;filter:blur(8px);opacity:.6;transition:filter .25s,opacity .25s;user-select:none}
.qans .u{align-self:flex-start;margin-top:6px;font-family:"Source Sans 3",system-ui,sans-serif;font-weight:600;font-size:.78rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.qans .u b,.qans .u [style]{color:var(--ink)!important}
.qhint{position:absolute;inset:0;display:grid;place-items:center;font-family:"Source Sans 3",system-ui,sans-serif;font-size:.8rem;font-weight:700;color:var(--muted)}
.qc.show .qans{filter:none;opacity:1;user-select:auto}
.qc.show .qhint{display:none}
.qc.show .qf{background:color-mix(in srgb,#3f9a6a 7%,var(--bg))}
.qc.show .qn{background:#3f9a6a;color:#fff}
@media (max-width:480px){.qf{font-size:1.02rem;padding:10px 12px}.qq{font-size:.88rem}}
body.hide .qc .ft,body.hide .qc .u{filter:none!important;user-select:auto}
.bar{flex-wrap:wrap}
.blink{font-size:.9rem;font-weight:600;text-decoration:none;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.blink:focus-visible{outline:3px solid var(--star);outline-offset:2px}
</style>

<body>
<div class="wrap">
<header class="top"><p class="kicker">M2 · Chimie</p><h1>Liaisons chimiques et orbitales moléculaires</h1><p class="meta">51 formules · <span class="s">★</span> tombées au concours · <span class="g">🔁</span> formules déduites, reliées à leur formule de base</p></header>
<div class="bar"><button id="bHide" aria-pressed="false">🙈 Cacher les formules</button><a class="blink" href="formules.html" style="margin-left:auto">← Cours</a><a class="blink" href="formules-liaisons-explications.html">📖 Explications</a></div>
<div class="cols"><span>Définition</span><span>Formule · unité · constante</span></div><div id="tb"></div>
<div id="quiz" hidden>
<div class="qhead"><div class="qtop"><span class="qtitle">Entraînement</span><span id="qcount" class="qcount"></span></div>

</div>
<script>
const H=()=>'';
const fr=(n,d)=>`<span class='frac'><span>${n}</span><span>${d}</span></span>`;
const data = [
 {id:"A", title:"Règles de Lewis et orbitales moléculaires", pages:"p.2-6", rows:[
  {k:"duet", st:0, q:"Règle du duet", d:"Atomes de la 1<sup>re</sup> période, comme l'hydrogène",
   f:"H entouré de 2 électrons (1 paire)", u:"Stabilité <b>maximale</b> de H",
   x:"<p>L'hydrogène n'a qu'une couche (1s<sup>1</sup> : 1 électron de valence). Il est stable dès qu'il est entouré d'<b>une seule paire</b> d'électrons, donc d'une seule liaison.</p><span class='tip'><b>Duo</b> = 2 : duet pour H, octet (8) pour les autres.</span>"},
  {k:"octet", st:0, q:"Règle de l'octet", d:"Chaque atome d'une molécule, hormis l'hydrogène",
   f:"8 électrons = 4 paires autour de l'atome", u:"Par analogie avec les gaz rares : <b>8 électrons de valence</b> (sauf He : 2)",
   x:"<p>La molécule est la plus stable quand chaque atome (sauf H) est entouré de <b>4 paires</b> d'électrons (liantes + libres). L'objectif des atomes : ressembler au <b>gaz rare le plus proche</b>. Selon Lewis, c'est cette règle qui permet de choisir la structure la plus fidèle.</p><span class='tip'>NH<sub>3</sub> : 3 paires liantes + 1 paire libre = 4 paires. H<sub>2</sub>O : 2 liantes + 2 libres = 4 paires.</span>"},
  {k:"d0", st:0, q:"Distance d'équilibre de la liaison H–H", d:"Distance à laquelle l'énergie potentielle est minimale",
   f:"d<sub>0</sub>(H–H) = 0,74 Å", u:"d<sub>0</sub> = distance d'équilibre · E<sub>0</sub> = énergie minimale",
   x:"<p>Quand deux atomes se rapprochent, l'énergie totale <b>baisse</b> (attraction) jusqu'à un minimum E<sub>0</sub> : c'est la formation de la liaison, à la distance d<sub>0</sub>. Plus près, la <b>répulsion</b> fait remonter l'énergie.</p><span class='tip'>Le recouvrement explique que la distance entre atomes d'une molécule soit <b>inférieure</b> à celle des OA des atomes juxtaposés.</span>"},
  {k:"lcao", st:0, q:"Orbitale moléculaire liante (théorie LCAO)", d:"Combinaison linéaire des fonctions d'onde Ψ<sub>A</sub> et Ψ<sub>B</sub> des atomes A et B",
   f:"Ψ<sub>a</sub> = C<sub>A</sub>Ψ<sub>A</sub> + C<sub>B</sub>Ψ<sub>B</sub>", u:"C<sub>A</sub>, C<sub>B</sub> = coefficients de pondération",
   x:"<p>LCAO = Combinaison Linéaire des Orbitales Atomiques. On <b>additionne</b> les deux fonctions d'onde, chacune pondérée par son coefficient : on obtient l'OM <b>liante</b>, de plus basse énergie. Recouvrement par des lobes de <b>mêmes signes</b>.</p><span class='tip'>Liante = <b>+</b> (on additionne).</span>"},
  {k:"anti", st:0, q:"Orbitale moléculaire antiliante (théorie LCAO)", d:"Même combinaison, avec une soustraction",
   f:"Ψ<sub>b</sub>* = C<sub>A</sub>Ψ<sub>A</sub> − C<sub>B</sub>Ψ<sub>B</sub>", u:"Identifiée par une <b>*</b>",
   x:"<p>En <b>soustrayant</b> les deux fonctions d'onde, on obtient l'OM <b>antiliante</b>, d'énergie plus élevée (déstabilisante). Recouvrement par des lobes de <b>signes opposés</b>.</p><span class='tip'>Antiliante = <b>−</b> et une étoile *.</span>"},
  {k:"cH2", st:0, q:"Coefficients de pondération pour H<sub>2</sub>", d:"Deux OA 1s<sup>1</sup> identiques",
   f:`C<sub>A</sub> = C<sub>B</sub> = ${fr('√2','2')}`, u:"",
   x:"<p>Les deux atomes d'hydrogène sont identiques : ils pèsent autant l'un que l'autre dans l'OM, d'où des coefficients égaux.</p>"},
  {k:"psiL", der:["cH2","lcao"], q:"OM liante σ de H<sub>2</sub>", d:"Obtenue par addition",
   f:`Ψ<sub>liante</sub> = ${fr('√2','2')} (Ψ<sub>A</sub> + Ψ<sub>B</sub>)`, u:"",
   x:"<p>Recouvrement des OA <b>maximal</b> : les 2 électrons de H<sub>2</sub> s'y placent, c'est l'OM σ.</p>"
   + H(["Pars de Ψ<sub>a</sub> = C<sub>A</sub>Ψ<sub>A</sub> + C<sub>B</sub>Ψ<sub>B</sub>.","Remplace C<sub>A</sub> et C<sub>B</sub> par √2/2.","Mets √2/2 en facteur."])},
  {k:"psiA", der:["cH2","anti"], q:"OM antiliante σ* de H<sub>2</sub>", d:"Obtenue par soustraction",
   f:`Ψ<sub>antiliante</sub> = ${fr('√2','2')} (Ψ<sub>A</sub> − Ψ<sub>B</sub>)`, u:"",
   x:"<p>Peu de recouvrement des OA et un <b>plan nodal central</b> qui sépare les deux lobes de l'OM. Elle reste vide dans H<sub>2</sub>.</p>"
   + H(["Pars de Ψ<sub>b</sub>* = C<sub>A</sub>Ψ<sub>A</sub> − C<sub>B</sub>Ψ<sub>B</sub>.","Remplace C<sub>A</sub> et C<sub>B</sub> par √2/2.","Mets √2/2 en facteur."])},
  {k:"nOM", st:0, q:"Nombre d'orbitales moléculaires", d:"Passage des atomes isolés à la molécule",
   f:"nombre d'OM = nombre d'OA", u:"<b>Moitié liantes</b> (plus basses, stabilisantes) · <b>moitié antiliantes</b> (plus hautes, déstabilisantes)",
   x:"<p>On ne crée ni ne perd d'orbitales : chaque paire d'OA combinées donne une OM liante et une OM antiliante.</p><span class='tip'>H<sub>2</sub> : 2 OA 1s → 2 OM (σ et σ*).</span>"},
  {k:"nO2", der:["nOM"], q:"Nombre d'OM de O<sub>2</sub>", d:"OA de valence : 2s, 2p<sub>x</sub>, 2p<sub>y</sub>, 2p<sub>z</sub>",
   f:"4 OA × 2 atomes = 8 OM", u:"4 liantes + 4 antiliantes",
   x:"<p>Chaque oxygène apporte ses 4 OA de valence ; on obtient les 8 OM du diagramme : σ<sub>s</sub>, σ<sub>s</sub>*, σ<sub>p</sub>, π<sub>x</sub>, π<sub>z</sub>, π<sub>x</sub>*, π<sub>z</sub>*, σ<sub>p</sub>*.</p>"
   + H(["Compte les OA de valence d'un O : 2s, 2p<sub>x</sub>, 2p<sub>y</sub>, 2p<sub>z</sub> = 4.","Multiplie par 2 atomes : 8 OA, donc 8 OM.","Moitié liantes, moitié antiliantes : 4 + 4."])},
  {k:"max2", st:1, q:"Remplissage des OM", d:"Principe de Pauli et règle de Hund, mêmes règles que pour l'atome",
   f:"2 électrons maximum par OM", u:"Avec les <b>électrons de la couche de valence</b> des atomes",
   x:"<p>On remplit les OM en partant des <b>moins énergétiques</b>, 2 électrons au plus par OM. Seuls les électrons de <b>valence</b> sont placés.</p><span class='tip'>O<sub>2</sub> : 6 électrons de valence par O → 12 électrons à placer.</span>"}
 ]},
 {id:"B", title:"Spin, magnétisme et ordre de liaison", pages:"p.6-8", rows:[
  {k:"trip", st:0, q:"Spin total de O<sub>2</sub> à l'état triplet", d:"2 électrons célibataires sur les deux OM π*",
   f:"S = +½ + ½ = 1", u:"État le <b>plus stable</b> : plus haut spin (règle de Hund)",
   x:"<p>Les deux derniers électrons de O<sub>2</sub> se placent chacun sur une π* avec des spins parallèles. Des électrons <b>non appariés</b> rendent la molécule <b>paramagnétique</b> (notion ★★) : O<sub>2</sub> liquide est attiré par les pôles d'un aimant.</p><span class='tip'>Paramagnétiques : O<sub>2</sub> triplet, NO (1 électron non apparié sur les π*, ★). Diamagnétiques (électrons tous appariés, ★) : N<sub>2</sub>, O<sub>2</sub> singulet.</span>"},
  {k:"sing", st:0, q:"Spin total de O<sub>2</sub> à l'état singulet", d:"Les 2 électrons appariés sur une même π*",
   f:"S = +½ − ½ = 0", u:"Espèce <b>excitée</b>, donc dangereuse",
   x:"<p>Les deux spins s'annulent : plus aucun électron célibataire, O<sub>2</sub> singulet est <b>diamagnétique</b>.</p><span class='trap'>Triplet (S = 1) = état stable ; singulet (S = 0) = état excité.</span>"},
  {k:"OL", st:2, q:"Ordre de liaison (indice de liaison)", d:"Calculable à partir du diagramme d'OM",
   f:`OL = ${fr('n<sub>e⁻</sub>(liante) − n<sub>e⁻</sub>(antiliante)','2')}`, u:"<b>Positif ou nul</b> ; fractions possibles",
   x:"<p>On compte les électrons placés dans les OM liantes, on retire ceux des OM antiliantes, et on divise par 2 (une liaison = une paire). Plus OL est grand, plus la liaison est multiple.</p><span class='tip'>« Liants moins antiliants, le tout sur 2 ».</span><span class='trap'>On ne compte que les électrons, pas les orbitales.</span>"},
  {k:"OLH2", der:["OL"], q:"OL de H<sub>2</sub>", d:"",
   f:`OL = ${fr('2 − 0','2')} = 1`, u:"1 liaison simple",
   x:"<p>Les 2 électrons sont dans σ, σ* est vide : une liaison simple, comme H–H en Lewis.</p>"
   + H(["Diagramme de H<sub>2</sub> : 2 électrons sur σ (liante), 0 sur σ*.","OL = (2 − 0) / 2 = 1."])},
  {k:"OLH2p", der:["OL"], q:"OL de H<sub>2</sub><sup>+</sup>", d:"Exemple de fraction de liaison",
   f:"OL = 0,5", u:"",
   x:"<p>C'est l'exemple du cours pour montrer qu'un OL peut être <b>fractionnaire</b>.</p>"
   + H(["H<sub>2</sub><sup>+</sup> a un électron de moins que H<sub>2</sub> : 1 électron sur σ, 0 sur σ*.","OL = (1 − 0) / 2 = 0,5."])},
  {k:"OLN2", der:["OL"], q:"OL de N<sub>2</sub>", d:"D'après le diagramme d'OM des électrons de valence",
   f:`OL = ${fr('8 − 2','2')} = 3`, u:"1 liaison triple",
   x:"<p>On retrouve la triple liaison N≡N de Lewis. Dans N<sub>2</sub>, les OM π sont <b>plus basses</b> que l'OM σ issue des OA p (interactions sp), mais ça ne change pas le décompte.</p>"
   + H(["Liants : σ<sub>1</sub> (2) + π (4) + σ<sub>2</sub> (2) = 8.","Antiliants : σ<sub>1</sub>* (2) ; les π* sont vides.","OL = (8 − 2) / 2 = 3."])},
  {k:"OLO2", der:["OL"], q:"OL de O<sub>2</sub>", d:"D'après le diagramme d'OM de O<sub>2</sub> triplet",
   f:`OL = ${fr('8 − 4','2')} = 2`, u:"1 liaison double",
   x:"<p>On retrouve la double liaison O=O de Lewis.</p>"
   + H(["Liants : σ<sub>s</sub> (2) + σ<sub>p</sub> (2) + π<sub>x</sub>, π<sub>z</sub> (4) = 8.","Antiliants : σ<sub>s</sub>* (2) + π* (2) = 4.","OL = (8 − 4) / 2 = 2."])},
  {k:"OLNO", der:["OL"], q:"OL de NO", d:"Molécule AB : diagramme dissymétrique (O plus électronégatif)",
   f:`OL = ${fr('8 − 3','2')} = 2,5`, u:"",
   x:"<p>NO a un électron de plus que N<sub>2</sub>, placé seul sur une π* : il est antiliant et <b>non apparié</b> (d'où le paramagnétisme de NO).</p>"
   + H(["Liants : σ (2) + π (4) + σ (2) = 8.","Antiliants : σ* (2) + π* (1) = 3.","OL = (8 − 3) / 2 = 2,5."])},
  {k:"He2", st:1, q:"OL de He<sub>2</sub>", d:"Cas des gaz rares",
   f:"OL = 0 → aucune liaison", u:"Molécule qui <b>ne peut pas exister</b>",
   x:"<p>OL = 0 : aucune liaison, donc la molécule n'existe pas. C'est le cas des <b>gaz rares</b> (★), qui existent à l'état isolé.</p><span class='tip'>Se retrouve avec @OL : sur le modèle du diagramme de H<sub>2</sub>, 2 électrons sur σ et 2 sur σ* → (2 − 2) / 2 = 0.</span>"},
  {k:"OLm", st:1, q:"Valeur de OL et type de liaison", d:"",
   f:"OL = 1 → simple · OL = 2 → double · OL = 3 → triple", u:"Longueur : simple &gt; double &gt; triple",
   x:"<p>OL donne le nombre de liaisons. En Lewis : liaison simple = 1 doublet partagé, double = 2 doublets, triple = 3 doublets. L'étoile porte sur OL = 1 (liaison simple).</p><span class='tip'>Plus la liaison est multiple, plus elle est <b>courte</b>.</span>"}
 ]},
 {id:"C", title:"Géométrie : méthode VSEPR et hybridation", pages:"p.9-13", rows:[
  {k:"vsepr", st:3, q:"Méthode VSEPR (Gillespie) : figure formée", d:"AX<sub>n</sub>E<sub>m</sub> : A central, n ligands X, m doublets libres E sur A",
   f:"n + m = 2 → droite · 3 → triangle · 4 → tétraèdre", u:"Géométrie des paires : <b>linéaire</b> · <b>trigonale</b> · <b>tétraédrique</b>",
   x:"<p>Les paires électroniques de valence de l'atome central se repoussent et s'écartent au maximum. On compte <b>ligands + doublets libres</b> : c'est n + m qui fixe la figure.</p><span class='tip'>A = atome central = le plus entouré.</span><span class='trap'>Les doublets libres comptent dans n + m, même s'ils ne se « voient » pas dans la forme de la molécule.</span>"},
  {k:"ax2", st:0, q:"Angle dans AX<sub>2</sub> (n + m = 2)", d:"",
   f:"180°", u:"Linéaire · BeCl<sub>2</sub>, CO<sub>2</sub>, HCN",
   x:"<p>Deux ligands de part et d'autre de A : molécule linéaire. AX<sub>1</sub>E<sub>1</sub> (N<sub>2</sub>) est aussi linéaire.</p>"},
  {k:"ax3", st:1, q:"Angle dans AX<sub>3</sub> (n + m = 3)", d:"",
   f:"120°", u:"Triangulaire (trigonale) · BF<sub>3</sub>, SO<sub>3</sub>, NO<sub>3</sub><sup>−</sup>, CO<sub>3</sub><sup>2−</sup>",
   x:"<p>Trois ligands dans un plan, en triangle. L'étoile porte sur la géométrie triangulaire ; l'exemple NO<sub>3</sub><sup>−</sup> est aussi tombé (★).</p>"},
  {k:"ax2e", st:0, q:"Angle dans AX<sub>2</sub>E (n + m = 3)", d:"",
   f:"&lt; 120°", u:"Coudée · SO<sub>2</sub>, O<sub>3</sub>, NO<sub>2</sub><sup>−</sup>, SnCl<sub>2</sub>",
   x:"<p>Même figure que AX<sub>3</sub>, mais un sommet est occupé par un doublet libre : la molécule est <b>coudée</b> et l'angle se <b>ferme</b> sous 120°.</p>"},
  {k:"ax4", st:0, q:"Angle dans AX<sub>4</sub> (n + m = 4)", d:"",
   f:"109,5°", u:"Tétraèdre · CH<sub>4</sub>, NH<sub>4</sub><sup>+</sup>, SO<sub>4</sub><sup>2−</sup>, CF<sub>4</sub>",
   x:"<p>Quatre ligands aux sommets d'un tétraèdre. SO<sub>4</sub><sup>2−</sup> est un exemple tombé (★).</p>"},
  {k:"ax3e", st:1, q:"Angle dans AX<sub>3</sub>E (n + m = 4)", d:"",
   f:"&lt; 109,5°", u:"Pyramide triangulaire · NH<sub>3</sub>, H<sub>3</sub>O<sup>+</sup>, SO<sub>3</sub><sup>2−</sup>",
   x:"<p>Un sommet du tétraèdre est un doublet libre : les trois ligands forment une <b>pyramide</b> et l'angle se ferme.</p><span class='tip'>H<sub>3</sub>O<sup>+</sup> est l'exemple le plus tombé (★★).</span>"},
  {k:"ax2e2", st:1, q:"Angle dans AX<sub>2</sub>E<sub>2</sub> (n + m = 4)", d:"",
   f:"&lt; 109,5°", u:"Coudée · H<sub>2</sub>O, SF<sub>2</sub>, ClO<sub>2</sub><sup>−</sup>, OF<sub>2</sub>",
   x:"<p>Deux sommets sur quatre sont des doublets libres : il reste une molécule <b>coudée</b>. C'est le cas de l'eau.</p><span class='trap'>Coudée existe pour n + m = 3 (AX<sub>2</sub>E, &lt; 120°) et pour n + m = 4 (AX<sub>2</sub>E<sub>2</sub>, &lt; 109,5°).</span>"},
  {k:"sp", st:0, q:"Hybridation sp", d:"1 orbitale s + 1 orbitale p",
   f:"2 orbitales sp à 180°", u:"Linéaire · BeCl<sub>2</sub>",
   x:"<p>Les OA externes se combinent en OA <b>identiques</b> : BeCl<sub>2</sub> a deux liaisons Be–Cl <b>égales</b>, ce que les OA s et p seules n'expliquaient pas. Les liaisons formées par des OA hybrides sont uniquement <b>σ</b> (recouvrement axial).</p><span class='tip'>Nombre d'OA hybrides = nombre d'OA mélangées : 1 + 1 = 2.</span>"},
  {k:"sp2", st:2, q:"Hybridation sp<sup>2</sup>", d:"1 orbitale s + 2 orbitales p",
   f:"3 orbitales sp<sup>2</sup> à 120°", u:"Trigonale · BF<sub>3</sub> (+ 1 orbitale 2p<sub>z</sub> restante)",
   x:"<p>Trois OA hybrides dans un plan à 120°. L'orbitale p non hybridée reste disponible pour une liaison π.</p><span class='tip'>1 + 2 = 3 orbitales ; même angle que AX<sub>3</sub>.</span>"},
  {k:"sp3", st:3, q:"Hybridation sp<sup>3</sup>", d:"1 orbitale s + 3 orbitales p",
   f:"4 orbitales sp<sup>3</sup> à 109,5°", u:"Tétraédrique · CCl<sub>4</sub>",
   x:"<p>Quatre OA hybrides vers les sommets d'un tétraèdre. Pour le carbone, on part de l'état excité 1s<sup>2</sup> 2s<sup>1</sup> 2p<sub>x</sub><sup>1</sup> 2p<sub>y</sub><sup>1</sup> 2p<sub>z</sub><sup>1</sup> (état fondamental 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>2</sup>, ★).</p><span class='tip'>sp, sp<sup>2</sup>, sp<sup>3</sup> : exposant + 1 = 2, 3, 4 orbitales ; angles 180°, 120°, 109,5° comme VSEPR.</span>"},
  {k:"acet", st:1, q:"Liaisons de l'acétylène HC≡CH", d:"Carbones hybridés sp",
   f:"2 σ C–H + 1 σ C–C + 2 π C–C", u:"2p<sub>x</sub><sup>1</sup> et 2p<sub>y</sub><sup>1</sup> forment les liaisons π",
   x:"<p>Chaque carbone sp forme <b>2 liaisons σ</b> (une vers H, une vers l'autre C). Les deux orbitales p restantes donnent les <b>2 liaisons π</b> : la triple liaison = 1 σ + 2 π.</p>"},
  {k:"ethy", st:1, q:"Liaisons de l'éthylène H<sub>2</sub>C=CH<sub>2</sub>", d:"Carbones hybridés sp<sup>2</sup>",
   f:"4 σ C–H + 1 σ C–C + 1 π C–C", u:"2p<sub>z</sub><sup>1</sup> forme la liaison π",
   x:"<p>Chaque carbone sp<sup>2</sup> forme <b>3 liaisons σ</b> (notion ★) : 2 vers H, 1 vers l'autre C. L'orbitale p restante donne la liaison π : double liaison = 1 σ + 1 π.</p>"},
  {k:"etha", st:0, q:"Liaisons de l'éthane H<sub>3</sub>C–CH<sub>3</sub>", d:"Carbones hybridés sp<sup>3</sup>",
   f:"6 σ C–H + 1 σ C–C", u:"Aucune liaison π",
   x:"<p>Chaque carbone sp<sup>3</sup> forme <b>4 liaisons σ</b> et il ne reste aucune orbitale p libre : que des liaisons simples.</p><span class='tip'>Triple = 1 σ + 2 π ; double = 1 σ + 1 π ; simple = 1 σ.</span>"}
 ]},
 {id:"D", title:"Polarité et interactions électrostatiques", pages:"p.14-16", rows:[
  {k:"delta", st:0, q:"Fraction de charge δ d'une liaison polarisée", d:"Molécule AB notée A<sup>δ+</sup>B<sup>δ−</sup>",
   f:"δ &lt; ±1 ; δ = 0 → liaison covalente pure", u:"Ex. N<sup>δ+</sup>O<sup>δ−</sup> dans NO",
   x:"<p>Quand A et B ont des électronégativités différentes (★), le doublet se rapproche de l'atome le plus électronégatif : il porte δ−, l'autre δ+. On a alors un pôle positif et un pôle négatif.</p><span class='trap'>La fiche écrit « δ &lt; ±1 » : à comprendre comme une fraction de charge comprise entre 0 et 1 en valeur absolue.</span>"},
  {k:"debye", st:0, q:"Unité classique du moment dipolaire", d:"Moment dipolaire μ = grandeur vectorielle",
   f:"1 D = 0,333.10<sup>−29</sup> C.m", u:"Unité SI : <b>coulomb.mètre</b> · unité classique : <b>Debye (D)</b>",
   x:"<p>Le dipôle est formé de deux charges −δ et +δ séparées de la distance interatomique d ; son moment μ se donne le plus souvent en Debye.</p><span class='tip'>Pour passer de C.m en D, divise par 0,333.10<sup>−29</sup>.</span>"},
  {k:"d480", st:0, q:"Moment dipolaire de deux charges + et − à 1 Å", d:"",
   f:"μ = 4,80 D", u:"d = 1 Å",
   x:"<p>Valeur de référence du cours pour deux charges opposées distantes de 1 Å.</p>"},
  {k:"mures", st:0, q:"Moment dipolaire résultant", d:"Molécule à plusieurs liaisons polarisées",
   f:"μ<sub>résultant</sub> = Σ μ (somme vectorielle)", u:"≠ 0 : molécule <b>polaire</b> · = 0 : molécule <b>apolaire</b>",
   x:"<p>On additionne les moments dipolaires de chaque liaison <b>comme des vecteurs</b> : s'ils se compensent (géométrie symétrique), la molécule est apolaire même si ses liaisons sont polarisées.</p><span class='tip'>CH<sub>4</sub> : apolaire (μ résultant nul).</span>"},
  {k:"muH2O", st:0, q:"Moment dipolaire de l'eau", d:"",
   f:"μ(H<sub>2</sub>O) = 1,8 D", u:"Molécule polaire",
   x:"<p>Non nul du fait de la géométrie <b>coudée</b>, donc non linéaire : les deux moments O–H ne se compensent pas (voir @ax2e2).</p>"},
  {k:"coul", st:0, q:"Énergie d'interaction coulombienne", d:"Deux ions de charges opposées q<sub>1</sub> et q<sub>2</sub> séparés d'une distance r",
   f:`E<sub>Coulomb</sub> = ${fr('q<sub>1</sub>.q<sub>2</sub>','4πεr')}`, u:"ε = permittivité électrique du milieu",
   x:"<p>C'est l'attraction entre ions de charges opposées qui assure la cohésion d'un composé ionique (cristal Na<sup>+</sup>Cl<sup>−</sup> : métaux alcalins du groupe 1 + halogènes du groupe 17). Elle diminue quand la distance r augmente (en 1/r).</p>"},
  {k:"coul0", der:["coul"], q:"Énergie coulombienne dans le vide", d:"",
   f:`E<sub>Coulomb</sub> = ${fr('q<sub>1</sub>.q<sub>2</sub>','4πε<sub>0</sub>r')}`, u:"ε<sub>0</sub> = permittivité du vide",
   x:"<p>Cas particulier où le milieu est le vide.</p>"
   + H(["Pars de E = q<sub>1</sub>.q<sub>2</sub> / 4πεr.","Dans le vide, ε = ε<sub>0</sub>."])},
  {k:"vdw", st:2, q:"Énergie des liaisons de Van der Waals", d:"Interactions électrostatiques entre dipôles, intermoléculaires",
   f:"5 à 10 kJ.mol<sup>−1</sup>", u:"Très faibles · attractives · courte portée (quelques Å)",
   x:"<p>Énergie faible, <b>contrairement aux interactions fortes</b> entre atomes que sont les liaisons covalentes (notion ★★).</p>"},
  {k:"kees", st:1, q:"Énergie de Keesom", d:"Deux molécules polaires de moments dipolaires p<sub>1</sub> et p<sub>2</sub>",
   f:`E<sub>Keesom</sub> = −k ${fr('p<sub>1</sub><sup>2</sup>.p<sub>2</sub><sup>2</sup>','r<sup>6</sup>')}`, u:"p<sub>i</sub> = moment dipolaire · r = distance moyenne · k = constante",
   x:"<p>Interaction <b>polaire–polaire</b> (★). Elle est plus forte si les molécules sont <b>plus polaires</b> et plus faible si elles sont <b>plus éloignées</b> (en 1/r<sup>6</sup>).</p><span class='tip'>En 1/r<sup>6</sup> : doubler r divise l'énergie par 2<sup>6</sup> = 64.</span>"},
  {k:"deb", st:0, q:"Énergie de Debye", d:"Dipôle permanent (molécule polaire) et dipôle induit (molécule apolaire polarisable)",
   f:`E<sub>Debye</sub> = −k ${fr('p<sup>2</sup>.α','r<sup>6</sup>')}`, u:"p = moment dipolaire de la polaire · α = volume de polarisabilité de l'apolaire",
   x:"<p>Interaction <b>polaire–apolaire</b> : la molécule polaire induit un dipôle dans l'apolaire. Plus forte si la polaire est plus polaire et si l'apolaire est plus polarisable.</p>"},
  {k:"lond", st:0, q:"Énergie de London", d:"Deux molécules apolaires : dipôles instantanés",
   f:`E<sub>London</sub> = −k ${fr('α<sub>1</sub>.α<sub>2</sub>','r<sup>6</sup>')}`, u:"α<sub>i</sub> = volume de polarisabilité de la molécule i",
   x:"<p>Interaction <b>apolaire–apolaire</b> : les électrons bougent, créant un dipôle instantané qui induit un dipôle chez la voisine.</p><span class='tip'>Keesom → p·p ; Debye → p·α ; London → α·α. Toutes en −k …/r<sup>6</sup>.</span>"}
 ]},
 {id:"E", title:"Liaisons hydrogène", pages:"p.17-18", rows:[
  {k:"hcov", st:1, q:"Liaison H comparée à une liaison covalente", d:"Interaction intermoléculaire, électrostatique à 90 %",
   f:"E<sub>covalente</sub> ≈ 20 × E<sub>liaison H</sub>", u:"Liaison H 20 fois plus faible",
   x:"<p>Interaction entre une paire d'électrons libres d'une molécule (accepteur) et un H d'une autre molécule (donneur). Son énergie plus faible permet de la <b>modifier à température ambiante</b>, contrairement aux liaisons covalentes.</p>"},
  {k:"hvdw", st:0, q:"Liaison H comparée à Van der Waals", d:"",
   f:"E<sub>liaison H</sub> ≈ 10 × E<sub>Van der Waals</sub>", u:"Liaisons H plus courtes que Van der Waals",
   x:"<p>La liaison H est de la même famille (dipôle–dipôle) mais nettement plus forte.</p><span class='trap'>Les ordres de grandeur de la fiche ne collent pas exactement : Van der Waals 5-10 kJ.mol<sup>−1</sup> (@vdw) × 10 ne donne pas 20-40 kJ.mol<sup>−1</sup> (@hmol), et les liaisons H faibles (@hfai) sont dites « semblables à Van der Waals » avec 1-4 kJ.mol<sup>−1</sup>. Retiens chaque valeur telle qu'elle est donnée.</span>"},
  {k:"hmol", st:0, q:"Énergie des liaisons H dans H<sub>2</sub>O, HF et NH<sub>3</sub>", d:"H déficitaires en électrons + paires libres sur O, N, F",
   f:"20 à 40 kJ.mol<sup>−1</sup>", u:"Plus courtes et plus fortes que Van der Waals",
   x:"<p>Conséquence : points d'ébullition de H<sub>2</sub>O, HF et NH<sub>3</sub> <b>beaucoup plus élevés</b> que prévu par l'évolution sur leur colonne (15, 16, 17). Les liaisons H stabilisent aussi les structures primaires et secondaires des protéines (hélice α).</p>"},
  {k:"hfai", st:0, q:"Liaisons hydrogène faibles", d:"Semblables aux forces de Van der Waals",
   f:"1 à 4 kJ.mol<sup>−1</sup>", u:"Distance <b>2,2 à 4,0 Å</b> · angle <b>90° à 150°</b>",
   x:"<p>Les plus longues et les moins alignées : faciles à casser.</p>"},
  {k:"hmod", st:0, q:"Liaisons hydrogène modérées", d:"",
   f:"4 à 15 kJ.mol<sup>−1</sup>", u:"Distance <b>1,5 à 3,2 Å</b> · angle <b>130° à 170°</b>",
   x:"<p>Intermédiaires en énergie, en distance et en angle.</p>"},
  {k:"hfor", st:0, q:"Liaisons hydrogène fortes", d:"Semblables aux liaisons covalentes",
   f:"15 à 40 kJ.mol<sup>−1</sup>", u:"Distance <b>1,2 à 2,5 Å</b> · angle <b>175° à 180°</b>",
   x:"<p>Plus la distance est <b>courte</b> et plus l'angle est <b>proche de 180°</b>, plus la liaison est difficile à casser.</p><span class='tip'>Faible → modérée → forte : énergie ↑, distance ↓, angle → 180°.</span>"}
 ]}
];



const tb=document.getElementById('tb');let h='';
const rowHTML=(r,code,par)=>`<div class="row${r.der?' der':''}${r.st?' star':''}" tabindex="0">
      <div class="d"><span class="code">${code}</span>${par?`<span class="from">🔁 Déduite de <b>${par}</b></span>`:''}<span class="name">${r.q}</span>${r.st?`<span class="s">${'★'.repeat(r.st)}</span>`:''}</div>
      <div class="f"><span class="ft">${r.f}</span>${r.u?`<span class="u">${r.u}</span>`:''}</div></div>`;
data.forEach(sec=>{
  h+=`<section class="blk" style="--c:var(--${sec.id})"><header><span class="letter">${sec.id}</span>${sec.title}</header><div class="rows">`;
  const groups=[];
  sec.rows.forEach((r,i)=>{const c=sec.id+(i+1); if(r.der&&groups.length) groups[groups.length-1].kids.push([r,c]); else groups.push({r,c,kids:[]});});
  groups.forEach(g=>{
    h+=`<div class="grp">`+rowHTML(g.r,g.c);
    if(g.kids.length) h+=`<div class="kids">`+g.kids.map(([r,c])=>rowHTML(r,c,g.c)).join('')+`</div>`;
    h+=`</div>`;
  });
  h+=`</div></section>`;
});
tb.innerHTML=h;
const b=document.getElementById('bHide'),quiz=document.getElementById('quiz'),qrows=document.getElementById('qrows');
const all=[];data.forEach(sec=>sec.rows.forEach(r=>all.push(r)));
const upd=()=>{const n=qrows.querySelectorAll('.qc.show').length,t=all.length;
  document.getElementById('qcount').textContent=`${n} / ${t} révélées`;document.getElementById('qbar').style.width=(100*n/t)+'%';};
const shuffle=()=>{
  const a=all.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  qrows.innerHTML=a.map((r,i)=>`<div class="qc${r.st?' star':''}" tabindex="0">
    <div class="qd"><span class="qn">${i+1}</span>${r.st?`<span class="qs">${'★'.repeat(r.st)}</span>`:''}<span class="qq">${r.q}</span></div>
    <div class="qf"><div class="qans"><span class="ft">${r.f}</span>${r.u?`<span class="u">${r.u}</span>`:''}</div><span class="qhint">👁 Révéler</span></div></div>`).join('');
  upd();
};
document.getElementById('bShuffle').onclick=()=>{shuffle();window.scrollTo({top:0});};
document.getElementById('bReset').onclick=()=>{qrows.querySelectorAll('.qc.show').forEach(c=>c.classList.remove('show'));upd();};
b.onclick=()=>{
  const on=document.body.classList.toggle('hide');b.setAttribute('aria-pressed',on);
  b.textContent=on?'↩ Revenir à la page de référence':'🙈 Cacher les formules';
  if(on)shuffle();
  quiz.hidden=!on;tb.hidden=on;document.querySelector('.cols').hidden=on;
  window.scrollTo({top:0});
};
const flip=e=>{const t=e.target.closest('.qc');if(t){t.classList.toggle('show');upd();}};
qrows.addEventListener('click',flip);
qrows.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(e);}});
</script>
</body>
</html>
