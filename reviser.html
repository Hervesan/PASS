function saveResults(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(results)); } catch(e){} }

const state = { course:null, chap:"all", tab:"fiches", qType:"all", qStatus:"all" };
const selections = {};   // id -> Set des lettres cochées
const validated = {};    // id -> true quand corrigé à l'écran

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const findMat = id => { for (const m of MODULES) for (const x of m.matieres) if (x.id === id) return x; return null; };
const chapsOf = d => Array.isArray(d.chap) ? d.chap : [d.chap];
const inChap = d => state.chap === "all" || chapsOf(d).includes(state.chap);

/* ---------- couleurs des cours ---------- */
const COURSE_COLORS = ["#5B5BD6","#0E9F9A","#E5484D","#F76B15","#8E4EC6","#3E63DD","#D6409F"];
const chapIndex = (c, id) => c.chapitres.findIndex(ch => ch.id === id);
const courseColor = (c, id) => { const ch = c.chapitres.find(x=>x.id===id); return (ch && ch.color) || COURSE_COLORS[Math.max(0,chapIndex(c,id)) % COURSE_COLORS.length]; };
const inC = (d, id) => chapsOf(d).includes(id);
const plural = (n, w) => n + " " + w + (n>1 && !/s$/.test(w) ? "s" : "");

/* ---------- 1. les matières ---------- */
function renderHome(){
  let html = "";
  MODULES.forEach(mod => {
    html += `<div class="module"><div class="module-head"><h2>Module ${mod.label.slice(1)}</h2><span>${plural(mod.matieres.length,"matière")}</span></div><div class="grid">`;
    mod.matieres.forEach(m => {
      const c = CONTENU[m.id];
      const ini = m.title.split(/[\s']+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0].toUpperCase()).join("");
      const sub = c ? `${plural(c.chapitres.length,"cours")} · <b style="color:#E2462A">${c.qcm.length} QCM</b>` : "Bientôt disponible";
      html += `<a class="mat ${c?"":"soon"}" href="#${m.id}" style="--c:${m.color}">
        <span class="ini">${ini}</span><span><h3>${m.title}</h3><span class="sub">${sub}</span></span><span class="go">→</span></a>`;
    });
    html += `</div></div>`;
  });
  document.getElementById("homeContent").innerHTML = html;
}

/* ---------- 2. les cours d'une matière ---------- */
function renderMatiere(){
  const m = findMat(state.course), c = CONTENU[state.course];
  document.body.style.setProperty("--acc", m.color);
  document.getElementById("matHead").innerHTML =
    `<h1>${m.title}</h1><p>${MODULES.find(x=>x.matieres.includes(m)).label} · ${c ? plural(c.chapitres.length,"cours") : "aucun cours pour l'instant"}</p>`;
  const box = document.getElementById("courseTiles");
  if (!c){ box.innerHTML = `<div class="empty">Rien pour l'instant. Les cours de cette matière apparaîtront ici dès qu'ils seront ajoutés.</div>`; return; }
  box.innerHTML = c.chapitres.map((ch,i) => {
    const nh = c.herve.filter(d=>inC(d,ch.id)).length, nf = c.fiches.filter(d=>inC(d,ch.id)).length;
    const qs = c.qcm.filter(q=>q.chap===ch.id);
    const ok = qs.filter(q=>results[q.id]==="ok").length, ko = qs.filter(q=>results[q.id]==="ko").length;
    const pct = n => qs.length ? 100*n/qs.length : 0;
    const base = `#${state.course}/${ch.id}`;
    return `<a class="ctile" href="${base}" style="--cc:${courseColor(c,ch.id)}">
      <div class="top" data-n="${i+1}"><span class="num">Cours ${i+1}</span><h3>${ch.label}</h3><div class="code">${ch.code||""}</div></div>
      <div class="bot">
        <div class="tilestats">
          <span class="tq"><b>${qs.length}</b> QCM</span>
          <span class="bar2"><i style="width:${pct(ok)}%;background:var(--ok)"></i><i style="width:${pct(ko)}%;background:var(--ko)"></i></span>
          <span class="tq2">${ok}/${qs.length} réussis</span>
        </div>
        <div class="tilesmall"><span><i style="background:#1E88FF"></i>${plural(courseDocsFor(c,ch.id),"document")}</span></div>
        <div class="enter"><span>Entrer dans le cours</span><span>→</span></div>
      </div></a>`;
  }).join("");
}

const courseDocsFor = (c, id) => [...c.herve, ...c.fiches, ...c.entrainement].filter(d => inC(d,id)).length;

/* ---------- 3. un cours ---------- */
function renderCourse(){
  const m = findMat(state.course), c = CONTENU[state.course];
  const ch = c.chapitres.find(x => x.id === state.chap);
  const i = chapIndex(c, ch.id);
  document.body.style.setProperty("--cc", courseColor(c, ch.id));
  document.getElementById("backMat").setAttribute("href", "#" + state.course);
  document.getElementById("courseHead").innerHTML = `<small>${m.title} · Cours ${i+1}</small><b>${ch.label}</b>`;
  const tabs = document.getElementById("tabs");
  const cnt = arr => arr.filter(inChap).length;
  document.getElementById("nDocs").textContent = courseDocs(c).length + " PDF";
  document.getElementById("nTrain").textContent = cnt(c.qcm) + " questions";
  tabs.querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === state.tab);
    b.onclick = () => go("#" + state.course + "/" + state.chap + "/" + b.dataset.tab);
  });
  const panel = document.getElementById("panel");
  panel.className = "panel k-" + state.tab;
  if (state.tab === "docs") panel.innerHTML = renderDocs(c);
  else renderTrain(c, panel);
}

/* ---------- onglet Documents : 3 rubriques, dans l'ordre où on s'en sert ---------- */
const DOC_CATS = [
  { id:"comprendre", n:1, titre:"Comprendre", sous:"ce qui sert à expliquer le cours", color:"#7C5CFF", bg:"#EFEAFF" },
  { id:"apprendre",  n:2, titre:"Apprendre",  sous:"ce qu'on relit et qu'on retient",  color:"#1E88FF", bg:"#E3F0FF" },
  { id:"cibler",     n:3, titre:"Cibler le concours", sous:"ce qui tombe, comment ça tombe, les exercices sur papier", color:"#0E9F9A", bg:"#DDF5F2" },
];
function catOf(d, from){
  if (d.cat) return d.cat;
  if (from === "herve") return "comprendre";
  if (from === "entrainement") return "cibler";
  return /Ce_qui_risque|Annales_par_rubrique/.test(d.fichier) ? "cibler" : "apprendre";
}
function courseDocs(c){
  const out = [];
  [["herve",c.herve],["fiches",c.fiches],["entrainement",c.entrainement]].forEach(([from,list]) =>
    list.filter(inChap).forEach(d => out.push({ d, cat: catOf(d, from) })));
  return out;
}
function renderDocs(c){
  const all = courseDocs(c);
  if (!all.length) return `<div class="empty">Pas encore de document pour ce cours.</div>`;
  return DOC_CATS.map(k => {
    const docs = all.filter(x => x.cat === k.id).map(x => x.d);
    return `<section class="dsec" style="--k:${k.color};--k-bg:${k.bg}">
      <div class="dhead"><span class="dn">${k.n}</span><span><b>${k.titre}</b><small>${k.sous}</small></span></div>
      ${docs.length ? `<div class="docs">${docs.map(docHTML).join("")}</div>` : `<div class="dnone">Rien dans cette rubrique pour ce cours.</div>`}
    </section>`;
  }).join("");
}

function docHTML(d){
  return `<a class="doc" href="${encodeURI(d.fichier)}" target="_blank" rel="noopener">
    <span class="ic">PDF</span><span><b>${esc(d.titre)}</b><small>${esc(d.desc||"")}</small></span></a>`;
}
/* ---------- rubrique M'entraîner ---------- */
function renderTrain(c, panel){
  const pdfs = c.entrainement.filter(inChap);
  const pool = c.qcm.filter(inChap);
  const qs = pool;
  const nOk = pool.filter(q => results[q.id] === "ok").length;
  const nKo = pool.filter(q => results[q.id] === "ko").length;
  const pct = n => pool.length ? (100*n/pool.length) : 0;
  const chip = (key,val,label) => `<button class="chip ${state[key]===val?"on":""}" data-k="${key}" data-v="${val}">${label}</button>`;

  panel.innerHTML = `
    <div class="qhero">
      <span class="big">${pool.length}</span>
      <span class="txt"><b>QCM interactifs</b><span>Coche, valide, lis la correction.</span>
        <div class="progress" style="margin-top:6px;color:#fff">
          <div class="bar"><i style="width:${pct(nOk)}%;background:#fff"></i><i style="width:${pct(nKo)}%;background:#600"></i></div>
          <span>${nOk} réussie${nOk>1?"s":""} · ${nKo} à refaire · ${pool.length}</span>
          <button class="linkbtn" id="resetAll">Remettre à zéro</button>
        </div></span>
    </div>
    <div id="qList">${qs.map(qHTML).join("") || `<div class="empty">Pas encore de QCM pour ce cours.</div>`}</div>`;

  panel.querySelectorAll(".qtools .chip").forEach(b => b.onclick = () => { state[b.dataset.k] = b.dataset.v; renderCourse(); });
  panel.querySelector("#resetAll").onclick = () => {
    if (!confirm("Effacer la progression des QCM affichés ?")) return;
    pool.forEach(q => { delete results[q.id]; delete selections[q.id]; delete validated[q.id]; });
    saveResults(); renderCourse();
  };
  qs.forEach(q => wireQ(q));
}

function chapLabel(id){ const c = CONTENU[state.course]; const ch = c.chapitres.find(x=>x.id===id); return ch ? ch.label : id; }

function qHTML(q){
  const sel = selections[q.id] || new Set();
  const done = !!validated[q.id];
  const st = results[q.id];
  const stTxt = st === "ok" ? `<span class="st ok">réussie</span>` : st === "ko" ? `<span class="st ko">à refaire</span>` : `<span class="st">${q.type}</span>`;
  let nBon=0, nErr=0, nOubli=0;
  const items = q.items.map((t,i) => {
    const L = LETTERS[i];
    let cls = sel.has(L) ? "sel" : "";
    let why = "", mark = "", Lbox = L;
    if (done){
      const juste = q.rep.includes(L), coche = sel.has(L);
      if (juste && coche){ cls="r-ok mine"; nBon++; Lbox="✓"; mark=`<span class="mark ok">✓ Ta réponse · juste</span>`; }
      else if (!juste && coche){ cls="r-ko mine"; nErr++; Lbox="✗"; mark=`<span class="mark ko">✗ Ta réponse · fausse</span>`; }
      else if (juste && !coche){ cls="r-miss"; nOubli++; mark=`<span class="mark miss">! Oubliée · elle était juste</span>`; }
      else { cls="r-neutral"; mark=`<span class="mark neutral">Pas cochée · fausse, bien vu</span>`; }
      why = `<div class="why">${esc(q.expl[i])}</div>`;
    }
    return `<button class="item ${cls}" data-l="${L}" ${done?"disabled":""}><span class="L">${Lbox}</span><span class="txt">${mark}${esc(t)}${why}</span></button>`;
  }).join("");
  let verdict = "";
  if (done){
    const ok = sameSet(sel, q.rep);
    const stat = (n,lab,c) => `<span class="vs ${c}"><b>${n}</b>${lab}</span>`;
    verdict = `<div class="verdict ${ok?"ok":"ko"}">
      <div class="vtop"><span class="vicon">${ok?"✓":"✗"}</span><span>${ok ? "Juste, sans faute !" : "Pas tout à fait"}<small>Réponse${q.rep.length>1?"s":""} attendue${q.rep.length>1?"s":""} : ${q.rep.split("").join(", ")}</small></span></div>
      <div class="vstats">${stat(nBon,"juste"+(nBon>1?"s":""),"g")}${stat(nErr,"erreur"+(nErr>1?"s":""),"r")}${stat(nOubli,"oubliée"+(nOubli>1?"s":""),"o")}</div>
    </div>`;
  }
  return `<div class="q ${done?"done":""} ${q.type==="QRU"?"qru":""}" id="q-${q.id}">
    <div class="q-head"><b>Exercice ${q.n} · ${esc(q.titre)}</b>${stTxt}</div>
    <div class="q-body">
      <p class="q-enonce">${esc(q.enonce)}${q.donnee ? `<span class="data">${esc(q.donnee)}</span>` : ""}</p>
      ${q.extra || ""}
      <div class="hint">${q.type === "QRU" ? "QRU · une seule réponse exacte" : "QRM · une ou plusieurs réponses exactes"}</div>
      ${verdict}
      ${items}
      <div class="actions">
        ${done ? `<button class="btn ghost" data-act="redo">Refaire la question</button>`
               : `<button class="btn main" data-act="check" ${sel.size?"":"disabled"}>Valider</button>`}
      </div>
      ${done ? `<div class="corr">
        <div class="box meth"><h4>Méthode pas à pas</h4><ol>${q.methode.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
        <div class="box trap"><h4>Pièges</h4>${esc(q.pieges)}</div></div>` : ""}
    </div></div>`;
}

function sameSet(set, rep){ return set.size === rep.length && rep.split("").every(L => set.has(L)); }

function wireQ(q){
  const el = document.getElementById("q-" + q.id);
  if (!el) return;
  el.querySelectorAll(".item").forEach(b => b.onclick = () => {
    if (validated[q.id]) return;
    const s = selections[q.id] || (selections[q.id] = new Set());
    const L = b.dataset.l;
    if (q.type === "QRU"){ const had = s.has(L); s.clear(); if (!had) s.add(L); }
    else { s.has(L) ? s.delete(L) : s.add(L); }
    redrawQ(q);
  });
  const btn = el.querySelector("[data-act]");
  if (btn) btn.onclick = () => {
    if (btn.dataset.act === "check"){
      validated[q.id] = true;
      results[q.id] = sameSet(selections[q.id] || new Set(), q.rep) ? "ok" : "ko";
      saveResults();
    } else {
      delete validated[q.id]; selections[q.id] = new Set();
    }
    redrawQ(q);
    refreshProgress();
  };
}
function redrawQ(q){
  const el = document.getElementById("q-" + q.id);
  const tmp = document.createElement("div"); tmp.innerHTML = qHTML(q);
  el.replaceWith(tmp.firstElementChild);
  wireQ(q);
}
function refreshProgress(){
  const c = CONTENU[state.course];
  const pool = c.qcm.filter(inChap);
  const nOk = pool.filter(q => results[q.id] === "ok").length;
  const nKo = pool.filter(q => results[q.id] === "ko").length;
  const bar = document.querySelector(".progress .bar");
  if (!bar) return;
  bar.children[0].style.width = (100*nOk/pool.length) + "%";
  bar.children[1].style.width = (100*nKo/pool.length) + "%";
  bar.nextElementSibling.textContent = `${nOk} réussie${nOk>1?"s":""} · ${nKo} à refaire · ${pool.length}`;
  document.getElementById("nTrain").textContent = pool.length + " questions";
}

/* ---------- navigation (#matiere/onglet) ---------- */
/* Navigation pilotée en JavaScript : fonctionne en ligne, en fichier local
   et dans les aperçus (où changer l'adresse de la page est bloqué). */
let currentHash = "";
try { currentHash = location.hash; } catch(e){}
function go(hash){
  currentHash = hash;
  try { if (location.hash !== hash) history.pushState(null, "", hash || location.pathname); } catch(e){}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (a){ e.preventDefault(); go(a.getAttribute("href") === "#" ? "" : a.getAttribute("href")); }
});
window.addEventListener("popstate", () => { try { currentHash = location.hash; } catch(e){} route(); });

function show(v){ ["viewHome","viewMatiere","viewCourse"].forEach(x => document.getElementById(x).classList.toggle("hidden", x !== v)); }
function route(){
  const [id, chap, tab] = decodeURIComponent(currentHash.replace(/^#/, "")).split("/");
  const c = id ? CONTENU[id] : null;
  if (id && findMat(id) && c && chap && c.chapitres.some(x => x.id === chap)){
    state.course = id; state.chap = chap;
    state.tab = tab === "train" || !tab ? "train" : "docs";
    show("viewCourse"); renderCourse();
  } else if (id && findMat(id)){
    state.course = id; state.chap = "all";
    document.body.style.removeProperty("--cc");
    show("viewMatiere"); renderMatiere();
  } else {
    state.course = null; state.chap = "all";
    document.body.style.removeProperty("--acc"); document.body.style.removeProperty("--cc");
    show("viewHome"); renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { try { if (location.hash !== currentHash){ currentHash = location.hash; route(); } } catch(e){} });
route();
</script>
