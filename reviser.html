<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour réviser — par matière et par cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0F4; --card:#FFFFFF; --ink:#111318; --soft:#4B5162; --mute:#8A90A0; --line:#E2E5EC;
    --night:#111318;
    --herve:#7C5CFF; --fiches:#1E88FF; --train:#FF6B2C;
    --grad:linear-gradient(120deg,#5B5BD6,#3E63DD 55%,#0EA5A4);
    --ok:#12A150; --ok-bg:#E5F7EC; --ko:#E5372B; --ko-bg:#FFECEA; --miss:#E08A00; --miss-bg:#FFF4DC;
    --radius:20px;
    --shadow:0 1px 2px rgba(17,19,24,.05), 0 12px 28px -16px rgba(17,19,24,.25);
    --c-biophysique:#E7A93C; --c-medicaments:#34D399; --c-physiologie:#F0729B;
    --c-biochimie:#2DD4BF; --c-milieu:#4FA6E7; --c-chimie:#A87FEE;
    --c-sciences-vie:#52C9A6; --c-anglais:#5B8CF0; --c-metiers:#F0894F; --c-sante-pub:#3FCBE8;
    --acc:#5B5BD6; --cc:#5B5BD6; --cc-ink:color-mix(in srgb,var(--cc) 70%,#000);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;}
  h1,h2,h3,.ttl{font-family:'Outfit','DM Sans',sans-serif;}
  a{color:inherit;} button{font-family:inherit;color:inherit;}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px;}
  .hidden{display:none !important;}

  /* ---------- boutons de navigation ---------- */
  .navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 0;}
  .pillbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:700;
    background:var(--card);color:var(--ink);border-radius:100px;padding:8px 14px;box-shadow:var(--shadow);}
  .pillbtn:hover{transform:translateY(-1px);}
  .crumb{font-size:12.5px;font-weight:700;color:var(--soft);letter-spacing:.02em;}
  .crumb b{color:var(--ink);}

  /* ---------- niveau 1 : matières ---------- */
  .hero{padding:10px 0 8px;}
  .hero h1{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:22px 0 6px;line-height:1;}
  .hero p{margin:0;color:var(--soft);font-size:15px;line-height:1.55;max-width:560px;}
  .steps{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;}
  .steps span{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:100px;padding:7px 12px 7px 7px;font-size:13px;font-weight:700;box-shadow:var(--shadow);}
  .steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11.5px;}

  .module{margin:26px 0 8px;}
  .module-head{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px;}
  .module-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;}
  .module-head span{font-size:12.5px;font-weight:700;color:var(--mute);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .mat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;text-decoration:none;
    background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s;}
  .mat:hover{transform:translateY(-3px);}
  .mat::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.22;}
  .mat .ini{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;color:#fff;background:var(--c);}
  .mat h3{position:relative;margin:14px 0 6px;font-size:18px;font-weight:700;line-height:1.2;letter-spacing:-.01em;}
  .mat .sub{position:relative;font-size:12.5px;font-weight:600;color:var(--soft);}
  .mat .go{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:17px;}
  .mat.soon{background:transparent;box-shadow:none;border:2px dashed #D3D7E0;}
  .mat.soon::before{opacity:.08;}
  .mat.soon .ini{background:#C9CDD8;}
  .mat.soon h3{color:var(--mute);}
  .mat.soon .go{display:none;}

  /* ---------- niveau 2 : les cours d'une matière ---------- */
  .mhead{background:color-mix(in srgb,var(--acc) 26%,#fff);padding-bottom:26px;}
  .mhead h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:20px 0 6px;line-height:1.05;}
  .mhead p{margin:0;color:var(--soft);font-size:14.5px;}
  .lead{margin:22px 4px 12px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);}
  .courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:30px;}
  .ctile{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;}
  .ctile:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(17,19,24,.05),0 20px 34px -16px rgba(17,19,24,.35);}
  .ctile .top{position:relative;padding:18px 18px 20px;color:#fff;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 62%,#000));overflow:hidden;}
  .ctile .top::after{content:attr(data-n);position:absolute;right:10px;bottom:-26px;font-family:'Outfit',sans-serif;font-size:120px;font-weight:800;line-height:1;opacity:.16;}
  .ctile .num{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.2);border-radius:100px;padding:4px 10px;}
  .ctile h3{position:relative;z-index:1;margin:12px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
  .ctile .code{position:relative;z-index:1;font-size:13px;font-weight:600;opacity:.85;}
  .ctile .bot{padding:14px 16px 16px;}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .counts span{display:flex;flex-direction:column;align-items:flex-start;border-radius:12px;padding:8px 10px;font-size:11.5px;font-weight:700;}
  .counts b{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;line-height:1.1;}
  .counts .h{background:#EFEAFF;color:#5A3EE0;} .counts .f{background:#E3F0FF;color:#1468D6;} .counts .t{background:#FFEDE4;color:#D2501A;}
  .cprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--soft);}
  .cprog .bar2{flex:1;height:8px;border-radius:100px;background:var(--bg);overflow:hidden;display:flex;}
  .cprog .bar2 i{display:block;height:100%;}
  .ctile .enter{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:11px 14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;}

  /* ---------- niveau 3 : un cours ---------- */
  .sticky{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 62%,#000));box-shadow:0 10px 24px -16px rgba(17,19,24,.7);}
  .cbar{display:flex;align-items:center;gap:10px;padding:12px 0 10px;}
  .iconbtn{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;text-decoration:none;font-size:19px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);}
  .iconbtn:hover{background:rgba(255,255,255,.3);}
  .ctitle{flex:1;min-width:0;}
  .ctitle small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctitle b{display:block;font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 12px;padding:4px;border-radius:16px;background:rgba(0,0,0,.18);}
  .tabs button{border:0;background:transparent;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:800;cursor:pointer;color:rgba(255,255,255,.85);line-height:1.2;}
  .tabs button span{display:block;font-size:11.5px;font-weight:600;margin-top:2px;opacity:.85;}
  .tabs button.on{background:#fff;}
  .tabs button[data-tab=herve].on{color:var(--herve);}
  .tabs button[data-tab=fiches].on{color:var(--fiches);}
  .tabs button[data-tab=train].on{color:var(--train);}

  .panel{padding:16px 0 50px;}
  .panel.k-herve{--k:var(--herve);--k-bg:#EFEAFF;}
  .panel.k-fiches{--k:var(--fiches);--k-bg:#E3F0FF;}
  .panel.k-train{--k:var(--train);--k-bg:#FFEDE4;}
  .intro{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55;margin:0 0 16px;background:var(--card);border-left:5px solid var(--k);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
  .chap-block{margin-bottom:22px;}
  .chap-title{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;}
  .chap-title small{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--mute);}
  .docs{display:grid;gap:10px;}
  .doc{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:70px;transition:transform .15s;}
  .doc:hover{transform:translateY(-2px);}
  .doc .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:var(--k);}
  .doc b{display:block;font-size:15px;font-weight:700;line-height:1.3;}
  .doc small{display:block;font-size:12.5px;color:var(--soft);margin-top:3px;line-height:1.4;}
  .doc::after{content:"↗";flex:none;margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--k-bg);color:var(--k);font-weight:800;}
  .empty{text-align:center;color:var(--soft);font-size:14px;padding:36px 16px;background:var(--card);border-radius:var(--radius);}
  .schema{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:4px 0 12px;}
  .schema svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
  table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;background:var(--card);}
  table.mini th,table.mini td{border:1px solid var(--line);padding:5px 6px;text-align:left;}
  table.mini th{background:var(--night);color:#fff;font-weight:700;}
  footer{color:var(--mute);font-size:12px;padding:20px 0 34px;text-align:center;}
  /* ---------- QCM ---------- */
  .qtools{background:var(--night);color:#fff;border-radius:var(--radius);padding:14px 16px;margin:0 0 16px;}
  .progress{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8);flex-wrap:wrap;}
  .bar{flex:1 1 140px;height:10px;background:rgba(255,255,255,.14);border-radius:100px;overflow:hidden;display:flex;}
  .bar i{display:block;height:100%;}
  .linkbtn{border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 11px;border-radius:100px;}

  .q{background:var(--card);border-radius:22px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;}
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;}
  .q-head b{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--cc-ink);text-transform:uppercase;line-height:1.5;}
  .q-head .st{flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:100px;background:var(--bg);color:var(--soft);}
  .q-head .st.ok{background:var(--ok);color:#fff;}
  .q-head .st.ko{background:var(--ko);color:#fff;}
  .q-body{padding:8px 16px 16px;}
  .q-enonce{font-size:16px;line-height:1.5;margin:0 0 12px;font-weight:700;letter-spacing:-.005em;}
  .q-enonce .data{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--soft);background:var(--bg);border-radius:10px;padding:8px 10px;}
  .hint{display:inline-block;font-size:11.5px;font-weight:800;color:var(--soft);background:var(--bg);border-radius:100px;padding:4px 10px;margin-bottom:10px;}

  .item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;
    border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.45;min-height:54px;transition:border-color .12s, background .12s;}
  .item:hover{border-color:#C9CDDB;}
  .item .L{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13.5px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px #D5D8E4;}
  .q.qru .item .L{border-radius:50%;}
  .item .txt{flex:1;min-width:0;padding-top:4px;}
  .item.sel{border-color:var(--herve);background:#F1EDFF;}
  .item.sel .L{background:var(--herve);color:#fff;box-shadow:none;}
  .item .why{display:none;margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--ink);}
  .done .item{cursor:default;}
  .done .item .why{display:block;}
  .item.r-ok{background:var(--ok-bg);border-color:var(--ok);}
  .item.r-ok .L{background:var(--ok);color:#fff;box-shadow:none;}
  .item.r-ko{background:var(--ko-bg);border-color:var(--ko);}
  .item.r-ko .L{background:var(--ko);color:#fff;box-shadow:none;}
  .item.r-miss{background:var(--miss-bg);border-color:var(--miss);}
  .item.r-miss .L{background:var(--miss);color:#fff;box-shadow:none;}
  .item.r-neutral{opacity:.75;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:100px;margin-right:6px;text-transform:uppercase;letter-spacing:.04em;color:#fff;}
  .tag.v{background:var(--ok);} .tag.f{background:var(--ko);} .tag.m{background:var(--miss);}

  .actions{display:flex;gap:8px;margin-top:12px;}
  .btn{flex:1;border:0;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;cursor:pointer;}
  .btn.main{background:var(--grad);color:#fff;box-shadow:0 10px 20px -10px #7C5CFF;}
  .btn.main:disabled{background:#E3E5EE;color:var(--mute);box-shadow:none;cursor:not-allowed;}
  .btn.ghost{background:var(--night);color:#fff;}

  .verdict{display:none;margin-top:12px;padding:14px 16px;border-radius:14px;font-weight:800;font-size:16px;color:#fff;}
  .done .verdict{display:block;}
  .verdict.ok{background:var(--ok);}
  .verdict.ko{background:var(--ko);}
  .verdict span{font-weight:600;display:block;font-size:13.5px;margin-top:2px;opacity:.92;}
  .corr{display:none;margin-top:4px;}
  .done .corr{display:block;}
  .box{border-radius:14px;padding:14px;font-size:14px;line-height:1.55;margin-top:10px;}
  .box h4{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .box.meth{background:#F1EDFF;}
  .box.meth h4{color:#5A3EE0;}
  .box.meth ol{margin:0;padding-left:20px;}
  .box.meth li{margin-bottom:5px;}
  .box.meth li::marker{color:#5A3EE0;font-weight:800;}
  .box.trap{background:var(--ko-bg);}
  .box.trap h4{color:var(--ko);}

  .schema{background:var(--bg);border-radius:14px;padding:10px;margin:4px 0 12px;}
  .schema svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
  table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;background:var(--card);}
  table.mini th,table.mini td{border:1px solid var(--line);padding:5px 6px;text-align:left;}
  table.mini th{background:var(--night);color:#fff;font-weight:700;}

  /* ===== mise en évidence de MES réponses après validation ===== */
  .done .item{opacity:1;}
  .item .mark{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 9px;border-radius:100px;margin:0 0 6px;width:max-content;max-width:100%;}
  .item .txt{display:flex;flex-direction:column;}
  .item .mark.ok{background:var(--ok);color:#fff;}
  .item .mark.ko{background:var(--ko);color:#fff;}
  .item .mark.miss{background:#fff;color:var(--miss);box-shadow:inset 0 0 0 2px var(--miss);}
  .item .mark.neutral{background:transparent;color:var(--mute);padding-left:0;}
  .item.mine{border-width:3px;padding:11px;}
  .item.r-ok.mine{background:#D9F3E3;box-shadow:0 8px 20px -12px var(--ok);}
  .item.r-ko.mine{background:#FFDCD8;box-shadow:0 8px 20px -12px var(--ko);}
  .item.mine .L{font-size:17px;width:32px;height:32px;}
  .item.r-ok.mine .txt,.item.r-ko.mine .txt{font-weight:600;}
  .item.r-miss{border-style:dashed;border-width:2.5px;background:#FFF8EA;}
  .item.r-neutral{opacity:1;background:var(--bg);border-color:transparent;}
  .item.r-neutral > .txt{color:var(--soft);}
  .item.r-neutral .L{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 2px #E1E3EA;}
  .item .why{font-weight:500;color:var(--ink);border-top:1px solid rgba(14,16,32,.08);padding-top:8px;}

  .verdict{margin:0 0 12px;padding:14px 16px;}
  .vtop{display:flex;align-items:center;gap:12px;font-size:17px;}
  .vtop small{display:block;font-size:13.5px;font-weight:600;opacity:.92;margin-top:1px;}
  .vicon{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:20px;}
  .vstats{display:flex;gap:6px;margin-top:12px;}
  .vs{flex:1;background:#fff;border-radius:12px;padding:7px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--soft);}
  .verdict .vicon{display:grid;margin:0;opacity:1;font-size:20px;}
  .verdict .vtop > span:last-child{display:block;font-size:17px;margin:0;opacity:1;}
  .verdict .vs{display:block;margin:0;opacity:1;}
  .vs b{display:block;font-size:20px;font-weight:800;line-height:1.1;}
  .vs.g b{color:var(--ok);} .vs.r b{color:var(--ko);} .vs.o b{color:var(--miss);}

  /* ===== QCM mis en avant ===== */
  .ctile .top{display:block;text-decoration:none;}
  .qcmbox{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:18px;padding:12px;color:#fff;
    background:linear-gradient(120deg,#FF6B2C,#FF3D6E);box-shadow:0 12px 22px -12px #FF5A3C;transition:transform .15s;}
  .qcmbox:hover{transform:translateY(-2px);}
  .qcmbox .qn{flex:none;width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
  .qcmbox .qn b{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;}
  .qcmbox .qn small{font-size:11px;font-weight:800;letter-spacing:.08em;margin-top:2px;}
  .qcmbox .qmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .qcmbox .qlab{font-size:13px;font-weight:700;}
  .qcmbox .bar2{height:8px;border-radius:100px;background:rgba(255,255,255,.3);overflow:hidden;display:flex;}
  .qcmbox .bar2 i{display:block;height:100%;}
  .qcmbox .bar2 i:first-child{background:#fff !important;}
  .qcmbox .bar2 i:last-child{background:rgba(70,0,0,.45) !important;}
  .qcmbox .qgo{flex:none;font-weight:800;font-size:13.5px;background:#fff;color:#E2462A;border-radius:100px;padding:8px 12px;}
  .minor{display:flex;gap:8px;margin-top:10px;}
  .minor a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:13px;font-weight:700;color:var(--soft);background:var(--bg);border-radius:12px;padding:9px;}
  .minor a:hover{color:var(--ink);}
  .minor i{width:8px;height:8px;border-radius:50%;}

  .tabs{grid-template-columns:1.5fr 1fr 1fr;}
  .tabs button[data-tab=train]{background:linear-gradient(120deg,#FF6B2C,#FF3D6E);color:#fff;}

  expl:["Étape 3 : λ et T ne dépendent ni de la température, ni de la pression, ni de la chimie.",
        "Étape 3 : la période biologique dépend de l'élimination par l'organisme, pas du noyau. Le mot « uniquement » est faux.",
        "Étape 4 : T double, donc A = 0,7 × N ÷ T est divisée par 2.",
        "Étape 4 : la période effective est toujours plus courte que la période physique (sens inversé).",
        "Étape 3 : au bout d'une période, l'activité a diminué de moitié (50 %). 75 % correspond à deux périodes."],
  pieges:"Physique = le noyau ; biologique = l'organisme ; effective = les deux ensemble, donc plus courte. « Diminué de 75 % » cache deux périodes, pas une." },

{ id:"radio-7", chap:"radio", n:7, type:"QRM", titre:"Schéma de désintégration",
  enonce:"Le schéma ci-dessous représente la désintégration d'un noyau X (numéro atomique Z) en un noyau Y. Seules les transitions β1, β2 et β3 partent de X. Les termes A, B, C et D sont à déterminer. Dans ce schéma :",
  extra: SCHEMA_RADIO7,
  items:["le terme A vaut 1 100 keV",
         "le terme B vaut 30 %",
         "le terme C vaut 400 keV",
         "le terme D vaut 30 %",
         "les électrons émis lors de la transition β3 ont une énergie moyenne de 500 keV"],
  rep:"ABE",
  methode:["J'annote le schéma : les flèches β partent de X vers la droite, donc Z augmente (β−, fils Z + 1) ; à côté de chaque flèche, j'écris son niveau de départ et d'arrivée.",
           "Énergie d'un β− : Emax = niveau de départ − niveau d'arrivée. Pour β2 : A = 1 500 − 400 = 1 100 keV.",
           "Intensités qui partent de X : elles font 100 %. B = 100 − 20 − 50 = 30 %.",
           "Énergie d'un γ : écart exact entre les deux niveaux. γ1 va de 900 à 400 keV : C = 900 − 400 = 500 keV.",
           "Un niveau excité se vide autant qu'il est rempli. Le niveau 400 keV reçoit β2 (30 %) et γ1 (15 %), et ne se vide que par γ3 : D = 30 + 15 = 45 %.",
           "Énergie moyenne d'un β : le tiers de l'énergie maximale. β3 : 1 500 ÷ 3 = 500 keV."],
  expl:["Étape 2.",
        "Étape 3.",
        "Étape 4 : 400 keV est le niveau d'arrivée, pas l'énergie du photon ; γ1 emporte la différence, 500 keV.",
        "Étape 5 : 30 % ne compte que β2 ; le niveau 400 keV est aussi rempli par γ1 (15 %), donc γ3 = 45 %.",
        "Étape 6."],
  pieges:"Deux pièges propres aux schémas : prendre un niveau d'énergie pour l'énergie d'une transition (toujours faire départ − arrivée), et oublier qu'un niveau peut être rempli par plusieurs flèches (additionner tout ce qui arrive)." },

{ id:"radio-8", chap:"radio", n:8, type:"QRU", titre:"Période effective",
  enonce:"Un médicament radiopharmaceutique est marqué au technétium 99m, de période physique 6 h. Sa période effective dans l'organisme est de 2 h. Quelle est sa période biologique ?",
  items:["1,5 h","3 h","4 h","8 h","12 h"],
  rep:"B",
  methode:["J'annote l'énoncé : Tphy = 6 h, Te = 2 h, on cherche Tbio. J'écris la formule : 1/Te = 1/Tphy + 1/Tbio, donc 1/Tbio = 1/Te − 1/Tphy.",
           "Je remplace : 1/Tbio = 1/2 − 1/6 = 3/6 − 1/6 = 2/6.",
           "Je calcule : Tbio = 6 ÷ 2 = 3 h.",
           "Je vérifie : avec 6 h et 3 h, Te = (6 × 3) ÷ (6 + 3) = 2 h, comme l'énoncé. Et 2 h est bien plus petit que 3 h et 6 h."],
  expl:["1,5 h = (6 × 2) ÷ (6 + 2) : on a traité Te comme si c'était la période biologique (étape 1).",
        "Bonne réponse (étapes 1 à 3).",
        "4 h = 6 − 2 : on a soustrait les périodes au lieu de leurs inverses (étape 2).",
        "8 h = 6 + 2 : somme des périodes (étape 1).",
        "12 h = 6 × 2 : produit sans diviser par la somme (étape 1)."],
  pieges:"La période effective est toujours la plus petite des trois. Pour retrouver une des deux autres, on soustrait les inverses, jamais les périodes." },

/* ---------------- INTERACTION ---------------- */
{ id:"inter-1", chap:"inter", n:1, type:"QRU", titre:"Effet photoélectrique",
  enonce:"À propos de l'effet photoélectrique, quelle est la seule proposition exacte ?",
  items:["il se produit entre un photon incident et un noyau du milieu traversé",
         "le photon incident cède une partie de son énergie à un électron et poursuit sa route",
         "l'énergie cinétique de l'électron éjecté est égale à l'énergie du photon incident diminuée de l'énergie de liaison de cet électron",
         "il peut se produire entre un positon incident et un électron du milieu",
         "dans l'eau, il est prépondérant pour des photons de 1 MeV"],
  rep:"C",
  methode:["Je vérifie la nature : les 3 effets concernent des photons (X, γ), jamais des positons ni des α.",
           "Je vérifie le partenaire : photoélectrique = un électron profond ; seule la création de paires se fait avec le noyau.",
           "Je vérifie le partage : photoélectrique = le photon donne toute son énergie et disparaît ; l'électron sort avec E − Eliaison.",
           "Je vérifie le domaine : dans l'eau, photoélectrique sous 50 keV, Compton de 50 keV à 20 MeV."],
  expl:["Étape 2 : avec un électron. « Noyau » est le mot échangé avec la création de paires.",
        "Étape 3 : c'est la définition du Compton. Le photoélectrique absorbe tout le photon.",
        "Étape 3.",
        "Étape 1 : « positon » à la place de « photon », piège tombé en 2023.",
        "Étape 4 : à 1 MeV dans l'eau, c'est le Compton qui domine."],
  pieges:"Lire chaque mot qui désigne un acteur : photon ou positon, électron ou noyau, toute ou une partie de l'énergie. Un seul mot échangé suffit à rendre l'item faux." },

{ id:"inter-2", chap:"inter", n:2, type:"QRM", titre:"Effet Compton",
  enonce:"Un photon γ de 500 keV interagit par effet Compton avec un électron des tissus. À propos de cette interaction :",
  items:["l'électron concerné est un électron peu lié, des couches externes",
         "le photon incident disparaît totalement",
         "le photon diffusé a une énergie inférieure à 500 keV",
         "l'énergie cinétique de l'électron Compton et l'énergie du photon diffusé ont pour somme environ 500 keV",
         "à cette énergie, le photon pourrait aussi créer une paire électron-positon"],
  rep:"ACD",
  methode:["Je pose le partenaire : Compton = un électron externe, peu lié.",
           "Je pose le partage : le photon donne une partie de son énergie à l'électron ; un photon diffusé, plus faible, repart dans une autre direction.",
           "J'écris le bilan : E photon incident ≈ E électron + E photon diffusé (l'énergie de liaison est négligeable).",
           "Je vérifie le seuil des paires : il faut plus de 1,022 MeV."],
  expl:["Étape 1.",
        "Étape 2 : c'est le photoélectrique qui fait disparaître le photon.",
        "Étape 2 : il a cédé une partie de son énergie.",
        "Étape 3.",
        "Étape 4 : 500 keV < 1,022 MeV, pas de paire possible."],
  pieges:"« Toute l'énergie est transmise à l'électron » est le piège Compton le plus fréquent (LAS 2022, LAS 2023). Compton = partage ; photoélectrique = tout." },

{ id:"inter-3", chap:"inter", n:3, type:"QRM", titre:"Nature des rayonnements X et γ",
  enonce:"À propos des rayonnements X et γ :",
  items:["ce sont des rayonnements électromagnétiques",
         "les photons X ont une origine nucléaire",
         "l'énergie d'un photon est proportionnelle à la fréquence du rayonnement",
         "un photon γ possède une masse au repos non nulle",
         "à énergie égale, un photon X et un photon γ interagissent de la même façon avec la matière"],
  rep:"ACE",
  methode:["Je classe : X et γ sont des photons, donc électromagnétiques, sans masse au repos.",
           "Je distingue l'origine : X naît dans le cortège (les électrons), γ dans le noyau.",
           "J'écris l'énergie : E = hν, proportionnelle à la fréquence (et non à une masse).",
           "Je retiens : seule l'origine distingue X et γ ; à énergie égale, ils se comportent de la même façon dans la matière."],
  expl:["Étape 1.",
        "Étape 2 : origine électronique. C'est le γ qui vient du noyau.",
        "Étape 3.",
        "Étapes 1 et 3 : le photon n'a pas de masse au repos (piège de 2021 et 2024).",
        "Étape 4."],
  pieges:"X = cortège, γ = noyau : c'est la seule différence. Toute phrase qui donne une masse au photon, ou qui en fait un rayonnement « particulaire », est fausse." },

{ id:"inter-4", chap:"inter", n:4, type:"QRM", titre:"Ionisant ou non",
  enonce:"On considère un rayonnement électromagnétique de longueur d'onde 50 nm.",
  donnee:"Donnée : E (en eV) ≈ 1 240 ÷ λ (en nm)",
  items:["son énergie est d'environ 25 eV",
         "ce rayonnement est ionisant",
         "un rayonnement ultraviolet de 300 nm est également ionisant",
         "le seuil d'ionisation des rayonnements électromagnétiques est d'environ 12,4 keV",
         "les neutrons sont des rayonnements directement ionisants"],
  rep:"AB",
  methode:["Je calcule l'énergie : 1 240 ÷ 50 ≈ 25 eV.",
           "Je compare au seuil : ionisant si E > 12,4 eV, soit λ < 100 nm.",
           "J'applique aux UV : 1 240 ÷ 300 ≈ 4 eV, sous le seuil.",
           "Je classe les modes : directement ionisants = particules chargées (α, β) ; indirectement = photons et neutrons."],
  expl:["Étape 1.",
        "Étape 2 : 25 eV > 12,4 eV, ou 50 nm < 100 nm.",
        "Étape 3 : environ 4 eV, non ionisant (piège de 2019).",
        "Étape 2 : 12,4 eV, pas keV. Piège d'unité.",
        "Étape 4 : neutres, ils sont indirectement ionisants."],
  pieges:"100 nm et 12,4 eV sont le même seuil vu de deux côtés : plus λ est courte, plus l'énergie est grande. Surveiller l'unité (eV, keV, MeV) dans chaque item." },

{ id:"inter-5", chap:"inter", n:5, type:"QRM", titre:"Parcours, portée et écrans",
  enonce:"À propos du comportement des particules dans la matière et de la radioprotection :",
  items:["pour un faisceau d'électrons, le parcours est supérieur à la portée",
         "pour des particules α, le parcours et la portée sont pratiquement égaux",
         "dans les tissus mous, la portée des particules α est de l'ordre du centimètre",
         "une feuille de papier suffit à arrêter des particules α",
         "un écran de plomb est la protection la plus adaptée contre un faisceau de neutrons"],
  rep:"ABD",
  methode:["Je pose la définition : parcours = longueur du chemin suivi ; portée = distance à vol d'oiseau.",
           "Je pose la trajectoire : électron = zigzag, donc parcours > portée ; α = trajectoire droite, donc parcours = portée.",
           "Je pose les distances : α = quelques dizaines de µm dans les tissus, quelques cm dans l'air ; β = environ 1 cm dans les tissus.",
           "Je pose les écrans : α → papier ; β → plexiglas ; X et γ → plomb ; neutrons → béton épais."],
  expl:["Étape 2.",
        "Étape 2.",
        "Étape 3 : quelques dizaines de µm (piège de 2022).",
        "Étape 4.",
        "Étape 4 : le béton (piège de 2025)."],
  pieges:"Parcours et portée : se demander si la trajectoire est droite (α) ou en zigzag (électrons). Écrans : chaque rayonnement a le sien, et le plomb n'est pas universel." },

{ id:"inter-6", chap:"inter", n:6, type:"QRM", titre:"Question mixte FC4 · FC5 · FC7",
  enonce:"Le fluor 18 (Z = 9), émetteur β+, est utilisé en tomographie par émission de positons (TEP). À ce propos :",
  items:["le noyau fils est l'oxygène 18 (Z = 8)",
         "la TEP détecte les deux photons de 511 keV émis dans des directions opposées",
         "les photons de 511 keV peuvent interagir dans les tissus par création de paires",
         "dans les tissus, les photons de 511 keV interagissent majoritairement par effet Compton",
         "le positon émis parcourt plusieurs centimètres dans les tissus avant de s'annihiler"],
  rep:"ABD",
  methode:["FC4 · Je fais la désintégration : β+ → Z − 1, A identique : fluor 18 (Z = 9) → oxygène 18 (Z = 8).",
           "FC7 · Je pose l'imagerie : le positon s'annihile avec un électron → 2 photons de 511 keV à 180°, détectés en coïncidence.",
           "FC5 · Je place 511 keV dans le tableau de l'eau : entre 50 keV et 20 MeV → Compton. Et 511 keV < 1,022 MeV → pas de paires.",
           "FC5 · Je pose la distance : le positon ne parcourt que quelques millimètres avant de s'annihiler."],
  expl:["Étape 1.",
        "Étape 2 : la caméra détecte les photons, pas le positon.",
        "Étape 3 : 511 keV est sous le seuil de 1,022 MeV.",
        "Étape 3.",
        "Étape 4 : quelques millimètres."],
  pieges:"Une question peut partir d'un radioélément (FC4), passer par son usage (FC7) et finir sur ce que son rayonnement fait dans la matière (FC5). Traiter chaque item avec le bon chapitre." },

{ id:"inter-7", chap:"inter", n:7, type:"QRU", titre:"Quel effet domine",
  enonce:"Dans l'eau ou les tissus mous, quelle est la seule proposition exacte ?",
  items:["pour un photon de 20 keV, l'effet Compton est prépondérant",
         "pour un photon de 200 keV, l'effet photoélectrique est prépondérant",
         "pour un photon de 5 MeV, l'effet Compton est prépondérant",
         "pour un photon de 800 keV, la création de paires est prépondérante",
         "pour un photon de 50 MeV, l'effet photoélectrique est prépondérant"],
  rep:"C",
  methode:["J'écris les limites dans l'eau : photoélectrique < 50 keV · Compton de 50 keV à 20 MeV · paires > 20 MeV.",
           "Je place chaque énergie dans la bonne case, en convertissant si besoin (1 MeV = 1 000 keV).",
           "Je vérifie le seuil : aucune paire possible sous 1,022 MeV."],
  expl:["Étape 2 : 20 keV < 50 keV → photoélectrique.",
        "Étape 2 : 200 keV est dans la zone Compton.",
        "Étape 2 : 5 MeV est entre 50 keV et 20 MeV.",
        "Étape 3 : 800 keV < 1,022 MeV, les paires sont impossibles.",
        "Étape 2 : au-dessus de 20 MeV, ce sont les paires."],
  pieges:"Dans l'ordre des énergies : photo, Compton, paires. Ne pas confondre les limites de l'eau (50 keV, 20 MeV) avec celles du plomb (500 keV, 1 MeV)." },

{ id:"inter-8", chap:"inter", n:8, type:"QRU", titre:"Calcul de CDA",
  enonce:"Un faisceau de photons traverse une plaque de 12 mm d'un matériau. Le nombre de photons transmis est divisé par 16. Quelle est la couche de demi-atténuation (CDA) de ce matériau ?",
  items:["0,75 mm","1,33 mm","3 mm","4 mm","6 mm"],
  rep:"C",
  methode:["J'écris le facteur en puissance de 2 : 16 = 2⁴, donc la plaque vaut n = 4 CDA.",
           "Je calcule : CDA = épaisseur ÷ n = 12 ÷ 4 = 3 mm.",
           "Je vérifie : 4 CDA de 3 mm = 12 mm, et 2⁴ = 16."],
  expl:["0,75 = 12 ÷ 16 : on a divisé par le facteur au lieu du nombre de CDA (étape 1).",
        "1,33 = 16 ÷ 12 : division à l'envers (étape 2).",
        "Bonne réponse (étapes 1 et 2).",
        "4 = 12 ÷ 3 : on a compté 3 CDA (2³ = 8, pas 16) (étape 1).",
        "6 = 12 ÷ 2 : on a compté 2 CDA (étape 1)."],
  pieges:"Comme pour les périodes : le facteur s'écrit 2 puissance n, et c'est n qu'on utilise, jamais le facteur lui-même. Bien lire si l'énoncé parle de photons transmis ou atténués." },

/* ---------------- EFFETS BIOLOGIQUES ---------------- */
{ id:"bio-1", chap:"bio", n:1, type:"QRM", titre:"Stochastiques ou déterministes",
  enonce:"À propos des effets biologiques des rayonnements ionisants :",
  items:["les effets déterministes n'apparaissent qu'au-delà d'une dose seuil",
         "la gravité des effets stochastiques augmente avec la dose reçue",
         "les cancers radio-induits sont des effets stochastiques",
         "les effets déterministes apparaissent en général plusieurs années après l'irradiation",
         "les effets stochastiques résultent de la mort d'un grand nombre de cellules"],
  rep:"AC",
  methode:["Je classe l'effet : stochastique = cellule mutée qui survit ; déterministe = mort d'un grand nombre de cellules.",
           "Je vérifie le seuil : déterministe = dose seuil ; stochastique = pas de seuil établi.",
           "Je vérifie ce qui monte avec la dose : déterministe = la gravité ; stochastique = la probabilité (gravité indépendante).",
           "Je vérifie le délai : déterministe = jours ou mois ; stochastique = années."],
  expl:["Étape 2.",
        "Étape 3 : c'est la probabilité qui augmente ; la gravité ne dépend pas de la dose.",
        "Étape 1 : les cancers viennent de cellules mutées.",
        "Étape 4 : précoces, en jours ou mois. Ce sont les stochastiques qui sont tardifs.",
        "Étape 1 : c'est la définition des effets déterministes."],
  pieges:"Les items échangent les deux colonnes du tableau : seuil, gravité ou probabilité, délai, cause. Écrire au crayon « S » ou « D » à côté de chaque item, puis vérifier chaque mot." },

{ id:"bio-2", chap:"bio", n:2, type:"QRM", titre:"ADN et devenir de la cellule",
  enonce:"Une cellule est irradiée et son ADN est lésé. À ce propos :",
  items:["si l'ADN est faiblement lésé et mal réparé, la cellule peut devenir une cellule mutée",
         "ce sont les cellules dont l'ADN est trop lésé qui sont à l'origine des mutations",
         "l'apoptose conduit à la fragmentation de la cellule en petits sous-ensembles non agressifs pour le milieu",
         "la nécrose peut conduire à une réaction inflammatoire dans le milieu voisin",
         "les systèmes enzymatiques de réparation réparent toujours toutes les lésions de l'ADN"],
  rep:"ACD",
  methode:["Je pose le niveau de lésion : faible → réparation (fidèle → cellule normale ; erronée → cellule mutée) ; forte → la cellule ne peut plus se diviser et meurt.",
           "Je distingue les deux morts : nécrose = éclatement, contenu largué, réaction inflammatoire ; apoptose = suicide, fragments non agressifs.",
           "Je rappelle la limite : les systèmes de réparation existent mais peuvent être dépassés."],
  expl:["Étape 1.",
        "Étape 1 : un ADN trop lésé tue la cellule ; les mutations viennent de l'ADN faiblement lésé (piège de 2025).",
        "Étape 2.",
        "Étape 2.",
        "Étape 3 : ils peuvent être dépassés (piège de 2019)."],
  pieges:"Une cellule morte ne transmet rien : seule une cellule survivante mal réparée peut donner une mutation. Apoptose = « non agressive », nécrose = inflammation : le mot « agressif » est souvent inversé." },

{ id:"bio-3", chap:"bio", n:3, type:"QRM", titre:"Radiolyse de l'eau et radicaux libres",
  enonce:"À propos de l'action des rayonnements ionisants sur les molécules du vivant :",
  items:["les effets biologiques sont dus surtout aux interactions avec les noyaux des atomes des milieux traversés",
         "l'eau étant le constituant principal de l'organisme, sa radiolyse joue un rôle majeur dans les effets indirects",
         "le radical OH· formé lors de la radiolyse de l'eau est un oxydant",
         "un radical libre est un fragment moléculaire peu réactif, donc inerte pour le milieu",
         "les effets indirects peuvent se poursuivre après la fin de l'irradiation"],
  rep:"BCE",
  methode:["Je pose le point de départ : le rayonnement interagit surtout avec les électrons (ionisations, excitations).",
           "Je pose la cible : l'eau = 70 % de l'organisme ; sa radiolyse produit les espèces réactives des effets indirects.",
           "Je liste les produits : OH· oxydant ; H· et électron solvaté réducteurs ; puis H₂O₂ et peroxydes.",
           "Je rappelle la nature d'un radical libre : un électron célibataire → très grande réactivité. Les espèces réactives continuent d'agir après l'irradiation."],
  expl:["Étape 1 : avec les électrons (piège de 2025).",
        "Étape 2.",
        "Étape 3.",
        "Étape 4 : très grande réactivité chimique (piège de 2020).",
        "Étape 4."],
  pieges:"Deux couples à ne pas inverser : électrons et non noyaux ; OH· oxydant, H· réducteur. Et « radical libre » va toujours avec « très réactif »." },

{ id:"bio-4", chap:"bio", n:4, type:"QRM", titre:"Radiosensibilité",
  enonce:"À propos de la radiosensibilité et des facteurs qui modifient les effets des rayonnements :",
  items:["plus une cellule est jeune, peu différenciée et à forte activité mitotique, plus elle est radiosensible",
         "les neurones font partie des cellules les plus radiosensibles",
         "la radiosensibilité cellulaire augmente avec la teneur en oxygène",
         "à dose égale, une exposition plus courte est moins destructrice",
         "à dose égale, une irradiation du corps entier est plus critique qu'une irradiation localisée"],
  rep:"ACE",
  methode:["J'applique la loi de Bergonié et Tribondeau : jeune, peu différenciée, se divise beaucoup → sensible. Moelle et cellules germinales très sensibles ; neurones très résistants.",
           "J'applique l'environnement : la sensibilité augmente avec l'oxygène et la température.",
           "J'applique le mode d'exposition : à dose égale, plus l'exposition est courte, plus c'est destructeur ; une irradiation globale est plus grave qu'une localisée."],
  expl:["Étape 1. L'inverse (« plus jeune, plus faible sensibilité ») est tombé en 2020.",
        "Étape 1 : ils sont très radiorésistants.",
        "Étape 2 (item tombé en 2019).",
        "Étape 3 : plus courte = débit plus élevé = plus destructrice.",
        "Étape 3."],
  pieges:"Le sens de variation est le piège : « plus jeune → plus sensible », « plus d'oxygène → plus sensible », « plus court → plus destructeur ». Vérifier que l'item ne l'a pas retourné." },

{ id:"bio-5", chap:"bio", n:5, type:"QRM", titre:"Dose absorbée et unités",
  enonce:"À propos de la dose absorbée :",
  items:["elle est définie comme la quantité d'énergie cédée par unité de masse de matière exposée",
         "dans le système international, elle s'exprime en joules par gramme",
         "1 gray correspond à 100 rad",
         "son unité usuelle est le sievert",
         "sa définition est valable quelle que soit la nature du rayonnement et celle de la matière absorbante"],
  rep:"ACE",
  methode:["J'écris la définition : D = dE ÷ dm, énergie cédée par unité de masse, valable pour tout rayonnement et toute matière.",
           "J'écris les unités : SI = J/kg ; usuelle = gray (1 Gy = 1 J/kg) ; ancienne = rad (1 Gy = 100 rad).",
           "Je range le sievert à sa place : il sert aux doses équivalente et efficace, pas à la dose absorbée."],
  expl:["Étape 1.",
        "Étape 2 : J/kg (piège de 2020).",
        "Étape 2.",
        "Étape 3 : le gray (piège de 2020).",
        "Étape 1."],
  pieges:"Kilogramme et non gramme ; gray pour la dose absorbée, sievert pour les doses pondérées. Ces deux échanges reviennent dans presque toutes les questions d'unités." },

{ id:"bio-6", chap:"bio", n:6, type:"QRM", titre:"Dose équivalente et dose efficace",
  enonce:"À propos de l'évaluation du risque lié aux rayonnements ionisants :",
  items:["la dose équivalente tient compte d'un facteur de pondération lié à la nature du rayonnement",
         "pour calculer la dose équivalente, il faut connaître le facteur de pondération lié au tissu irradié",
         "le facteur de pondération radiologique des particules α vaut 20",
         "la dose efficace s'exprime en gray",
         "les doses équivalente et efficace servent à évaluer la probabilité d'apparition d'effets stochastiques"],
  rep:"ACE",
  methode:["Je range les facteurs : WR = rayonnement → dose équivalente H = WR × D ; WT = tissu → dose efficace E = Σ WT × H.",

  expl:["Étape 1.",

        "Étape 3 : en sievert.",
        "Étape 3."],
  pieges:"Équivalente ↔ rayonnement (WR) ; efficace ↔ tissu (WT). L'item de 2023 a simplement échangé « rayonnement » et « tissu »." },

{ id:"bio-7", chap:"bio", n:7, type:"QRM", titre:"Courbes de survie cellulaire",

{ id:"bio-8", chap:"bio", n:8, type:"QRU", titre:"Calcul de dose équivalente et efficace",

/* ---------------- PROPRIÉTÉS CINÉTIQUES ---------------- */
{ id:"cin-1", chap:"cin", n:1, type:"QRM", titre:"Membrane sélective",
  enonce:"Deux compartiments 1 et 2, de même volume, sont séparés par une membrane dialysante. Au départ, le compartiment 1 contient une solution de glucose à 4 g/L et le compartiment 2 contient de l'eau pure.",
  donnee:"Données : surface totale des pores S = 1 m² ; épaisseur de la membrane h = 20 µm ; coefficient de diffusion du glucose D = 10⁻⁹ m²/s ; coefficient de réflexion de la membrane vis-à-vis du glucose σ = 0,5.",
  items:["le débit massique initial de glucose à travers la membrane est de 0,1 g/s",
         "si l'on réalisait la même expérience à une température plus élevée, le débit initial de glucose serait plus faible",
         "la membrane laisse passer l'eau et tous les solutés",
         "à l'équilibre, la concentration en glucose sera de 2 g/L dans chaque compartiment",
         "le débit de glucose augmente au cours du temps jusqu'à être maximal à l'équilibre"],
  rep:"AD",
  methode:["J'annote l'énoncé. Glucose : compartiment 1 → compartiment 2 (du plus concentré vers le moins concentré). σ = 0,5 : membrane sélective. Moment demandé : le départ (items A, B) et l'équilibre (items D, E).",
           "J'écris la formule. Membrane sélective : J = D × (1 − σ) × S × ΔC / h, avec 1 − σ = 0,5.",
           "Je convertis : ΔC = 4 − 0 = 4 g/L = 4 000 g/m³ ; h = 20 µm = 2 × 10⁻⁵ m.",
           "Je calcule : chiffres, puis puissances de 10. 0,5 × 4 000 = 2 × 10³ ; 2 × 10³ × 10⁻⁹ = 2 × 10⁻⁶ ; 2 × 10⁻⁶ / (2 × 10⁻⁵) = 0,1 g/s.",
           "J'applique les règles du cours. D = kT / (6π r η) : quand T monte, D monte, donc le débit aussi. Volumes égaux, un côté part de 0 : à l'équilibre, chacun a 4 / 2 = 2 g/L. Le débit est maximal au départ et nul à l'équilibre."],
  expl:["Étape 4 : 0,1 g/s.",
        "Étape 5 : sens de variation renversé. La chaleur augmente D, donc le débit.",
        "Étape 1 : σ = 0,5, membrane sélective. « Eau et tous les solutés », c'est σ = 0.",
        "Étape 5 : 4 / 2 = 2 g/L.",
        "Étape 5 : départ et équilibre échangés. Le débit est maximal au départ, nul à l'équilibre."],
  pieges:"Oublier (1 − σ) donne 0,2 g/s, faux d'un facteur 2. g/L × 1 000 = g/m³ ; µm × 10⁻⁶ = m. Un côté à 0 → la moitié de chaque côté à l'équilibre. Débit maximal au départ, nul à l'équilibre." },

{ id:"cin-2", chap:"cin", n:2, type:"QRM", titre:"À propos des déplacements en solution",
  enonce:"À propos des déplacements en solution :",
  items:["l'osmose est un déplacement d'eau du compartiment le moins concentré en soluté vers le plus concentré",
         "un liquide filtre à travers une membrane parce que les concentrations sont différentes de part et d'autre",
         "la convection est un transport de tout le liquide induit par une force extérieure",
         "la diffusion est un phénomène irréversible qui tend à homogénéiser les concentrations",
         "le coefficient de diffusion d'un soluté est une constante, indépendante de la température"],
  rep:"ACD",
  methode:["Je repère qui se déplace : l'eau (osmose), le soluté (diffusion), le liquide poussé par une pression (filtration) ou par une force extérieure (convection).",
           "Je repère le moteur et le sens. Diffusion : différence de concentration, du plus vers le moins concentré. Osmose : l'eau va du moins vers le plus concentré en soluté. Filtration : différence de pression hydrostatique.",
           "Je rappelle ce qui fait varier D. D = kT / (6π r η) dépend de la température, de la viscosité et de la taille de la molécule.",
           "Je compare mot à mot. Un seul mot changé suffit à rendre l'item faux."],
  expl:["Étape 2.",
        "Étape 2 : moteur échangé. La filtration est due à une différence de pression ; une différence de concentration fait diffuser le soluté.",
        "Étape 1.",
        "Étape 2 : la diffusion va jusqu'à l'égalité des concentrations.",
        "Étape 3 : D n'est pas une constante, il augmente avec la température."],
  pieges:"Diffusion (concentration), filtration (pression), convection (force extérieure). Le soluté va du plus vers le moins concentré ; l'eau va du moins vers le plus concentré. D varie avec la température, la viscosité et la taille de la molécule." },

{ id:"cin-3", chap:"cin", n:3, type:"QRM", titre:"Séance d'hémodialyse",
  enonce:"Un malade dont le compartiment aqueux a un volume de 40 L présente une urémie de 3 g/L. On veut la ramener à 0,5 g/L par hémodialyse, à travers une membrane dialysante perméable à l'urée. Le dialysat est renouvelé en permanence et ne contient pas d'urée.",
  items:["l'urée passe du sang vers le dialysat par diffusion",
         "ce passage de l'urée consomme de l'ATP",
         "la masse d'urée à épurer est de 100 g",
         "le renouvellement permanent du dialysat maintient une différence de concentration en urée entre le sang et le dialysat",
         "une clairance de l'urée de 150 mL/min signifie que 150 mg d'urée sont éliminés chaque minute"],
  rep:"ACD",
  methode:["J'annote l'énoncé. Urée : sang (3 g/L) → dialysat (0 g/L). Phénomène : diffusion. Volume 40 L, urémie visée 0,5 g/L.",
           "J'applique la règle. La diffusion va du plus concentré vers le moins concentré ; c'est un transport passif, sans ATP.",
           "J'écris la formule. Masse à épurer = (urémie de départ − urémie visée) × volume.",
           "Je calcule : (3 − 0,5) × 40 = 2,5 × 40 = 100 g.",
           "Je rappelle les définitions. Si le dialysat n'était pas renouvelé, sa concentration monterait et la différence de concentration diminuerait. La clairance est un volume épuré par unité de temps."],
  expl:["Étapes 1 et 2.",
        "Étape 2 : la diffusion est passive, l'agitation thermique suffit.",
        "Étape 4 : 100 g.",
        "Étape 5.",
        "Étape 5 : grandeur échangée. 150 mL/min est un volume de plasma épuré chaque minute, pas une masse d'urée."],
  pieges:"Oublier de retirer l'urémie visée donne 120 g. Diffusion = passive. Clairance = volume épuré par unité de temps. L'urée va du sang vers le dialysat, jamais l'inverse." },

{ id:"cin-4", chap:"cin", n:4, type:"QRU", titre:"Volume d'ultrafiltrat d'une séance",
  enonce:"Au cours d'une séance d'hémofiltration de 3 heures, on retire 5,4 L d'ultrafiltrat à un malade. Le débit sanguin dans le circuit est de 300 mL/min, la surface de la membrane est de 1,8 m² et la pression transmembranaire est de 200 mmHg. Le débit moyen d'ultrafiltration est de :",
  items:["5 × 10⁻⁷ m³/s","1,5 × 10⁻⁶ m³/s","5 × 10⁻⁶ m³/s","3 × 10⁻⁵ m³/s","5 × 10⁻⁴ m³/s"],
  rep:"A",
  methode:["J'annote l'énoncé. On cherche le débit d'ultrafiltrat : débit = volume retiré / durée. Le débit sanguin, la surface et la pression ne servent pas.",
           "J'encadre avant de calculer. 5,4 L ≈ 5 × 10⁻³ m³ et 3 h ≈ 10⁴ s : le résultat est de l'ordre de 5 × 10⁻⁷ m³/s. Cela élimine déjà B à E.",
           "Je convertis : V = 5,4 L = 5,4 × 10⁻³ m³ ; Δt = 3 × 3 600 s = 10 800 s.",
           "Je calcule : 5,4 × 10⁻³ / (1,08 × 10⁴) = 5 × 10⁻⁷ m³/s (soit 30 mL/min)."],
  expl:["Étape 4 : bonne réponse.",
        "Étape 3 : seule la première heure a été comptée (5,4 L / 3 600 s).",
        "Étape 1 : c'est le débit sanguin (300 mL/min), pas le débit d'ultrafiltrat.",
        "Étape 3 : le temps est resté en minutes (5,4 × 10⁻³ m³ / 180).",
        "Étape 3 : 1 L converti en 1 m³ au lieu de 10⁻³ m³ (facteur 1 000)."],
  pieges:"Choisir le bon débit : ultrafiltrat, pas débit sanguin. 3 h = 10 800 s. 1 L = 10⁻³ m³ et 1 mL = 10⁻⁶ m³. Encadrer d'abord l'ordre de grandeur." },

{ id:"cin-5", chap:"cin", n:5, type:"QRM", titre:"Filtration à travers une membrane d'hémofiltre",
  enonce:"Au cours d'une hémofiltration, de l'eau plasmatique traverse une membrane comportant de nombreux pores cylindriques identiques, sous l'effet d'une différence de pression hydrostatique entre le sang et le compartiment de filtration.",
  items:["le liquide se déplace du compartiment où la pression est la plus haute vers celui où elle est la plus basse",
         "si le rayon des pores double, le débit de filtration double",
         "si la différence de pression double, le débit de filtration double",
         "au cours de l'hémofiltration, de l'urée est aussi éliminée, emportée avec l'eau plasmatique",
         "si l'épaisseur de la membrane double, le débit de filtration double"],
  rep:"ACD",
  methode:["J'annote l'énoncé. Phénomène : filtration (hémofiltration = ultrafiltration). Moteur : différence de pression. Sens : de la pression haute vers la pression basse.",
           "J'écris la formule. J = Np × π × a⁴ × ΔP / (8 × η × h). Au numérateur : a⁴ et ΔP. Au dénominateur : η et h.",
           "J'applique les proportionnalités : rayon × 2 → débit × 2⁴ = × 16 ; pression × 2 → débit × 2 ; épaisseur × 2 → débit ÷ 2.",
           "Je rappelle le cours. Le solvant qui filtre entraîne avec lui les petits solutés, comme l'urée (solvent drag)."],
  expl:["Étape 1.",
        "Étape 3 : rayon à la puissance 4, le débit est multiplié par 16.",
        "Étape 3.",
        "Étape 4.",
        "Étape 3 : rapport renversé. L'épaisseur est au dénominateur, le débit est divisé par 2."],
  pieges:"Rayon × 2 → débit × 16. Ce qui est au dénominateur (épaisseur, viscosité) fait baisser le débit. Hémofiltration (pression) ≠ hémodialyse (diffusion)." },

{ id:"cin-6", chap:"cin", n:6, type:"QRM", titre:"À propos des membranes",
  enonce:"À propos des membranes :",
  items:["une membrane de coefficient de réflexion σ = 1 est hémiperméable : elle ne laisse passer que l'eau",
         "une membrane de coefficient de réflexion σ = 0 retient tous les solutés",
         "à travers une membrane biologique, les ions passent par des canaux",
         "une membrane comportant 10⁸ pores de rayon 1 µm a une surface totale de pores d'environ 3 × 10⁻⁴ m²",
         "dans l'organisme, en état stationnaire, le gradient de concentration d'un soluté est nul"],
  rep:"ACD",
  methode:["Je lis σ. σ = 1 : seule l'eau passe (hémiperméable). σ = 0 : l'eau et tous les solutés passent (perméable). Entre les deux : certains solutés, selon leur taille.",
           "Je rappelle la membrane biologique. Molécules lipophiles : passage facile ; glucose, acides aminés : transporteurs ; ions : canaux ; eau : aquaporines.",
           "J'écris la formule de la surface des pores : Sp = Np × π × a², avec a en mètres.",
           "Je calcule : a = 1 µm = 10⁻⁶ m, a² = 10⁻¹² ; Sp = 10⁸ × π × 10⁻¹² = π × 10⁻⁴ ≈ 3 × 10⁻⁴ m².",
           "Je distingue équilibre et état stationnaire. Équilibre : gradient et flux nuls. État stationnaire (organisme) : gradient et flux constants, mais pas nuls."],
  expl:["Étape 1.",
        "Étape 1 : σ = 0 et σ = 1 échangés. σ = 0 laisse passer tous les solutés.",
        "Étape 2.",
        "Étape 4.",
        "Étape 5 : état stationnaire et équilibre confondus. Le gradient est constant, pas nul."],
  pieges:"σ = 0 perméable, σ = 1 hémiperméable. Rayon au carré pour une surface, à la puissance 4 pour un débit de filtration. État stationnaire = constant ; équilibre = nul." },

{ id:"cin-7", chap:"cin", n:7, type:"QRM", titre:"Urée entre deux compartiments",
  enonce:"Deux compartiments 1 et 2, de même volume, sont séparés par une membrane perméable à l'urée (σ = 0). Au départ, la concentration en urée est de 10 mmol/L dans le compartiment 1 et de 30 mmol/L dans le compartiment 2.",
  donnee:"Données : surface totale des pores S = 0,5 m² ; épaisseur de la membrane h = 10 µm ; coefficient de diffusion de l'urée D = 2 × 10⁻⁹ m²/s.",
  items:["l'urée diffuse du compartiment 1 vers le compartiment 2",
         "le débit molaire initial d'urée à travers la membrane est de 2 mmol/s",
         "le débit molaire d'urée s'exprime en kg/s",
         "à l'équilibre, la concentration en urée sera de 20 mmol/L dans chaque compartiment",
         "une fois l'équilibre atteint, plus aucune molécule d'urée ne traverse la membrane"],
  rep:"BD",
  methode:["J'annote l'énoncé. Urée : compartiment 2 (30 mmol/L) → compartiment 1 (10 mmol/L). σ = 0 : membrane perméable, pas de correction. Concentrations en mmol/L : le débit sortira en moles par seconde.",
           "J'écris la formule : J = D × S × ΔC / h.",
           "Je convertis : ΔC = 30 − 10 = 20 mmol/L = 20 mol/m³ (1 mmol/L = 1 mol/m³) ; h = 10 µm = 10⁻⁵ m.",
           "Je calcule : 2 × 0,5 × 20 = 20 = 2 × 10¹ ; 2 × 10¹ × 10⁻⁹ = 2 × 10⁻⁸ ; 2 × 10⁻⁸ / 10⁻⁵ = 2 × 10⁻³ mol/s = 2 mmol/s.",
           "J'applique les règles du cours. Débit molaire = moles par unité de temps, en mol/s. Volumes égaux : à l'équilibre, (10 + 30) / 2 = 20 mmol/L. À l'équilibre, le flux net est nul : les molécules continuent de traverser, autant dans un sens que dans l'autre."],
  expl:["Étape 1 : sens inversé. L'urée va du plus concentré (compartiment 2) vers le moins concentré (compartiment 1).",
        "Étape 4 : 2 mmol/s.",
        "Étape 5 : unité échangée. kg/s est l'unité du débit massique ; le débit molaire est en mol/s.",
        "Étape 5 : (10 + 30) / 2 = 20 mmol/L.",
        "Étape 5 : flux net nul ne veut pas dire passage arrêté. Les échanges continuent dans les deux sens."],
  pieges:"Lire le sens sur les concentrations, pas sur les numéros des compartiments. 1 mmol/L = 1 mol/m³. Débit molaire en mol/s, massique en kg/s. À l'équilibre, le flux net est nul mais les molécules traversent toujours." },

/* ---------------- PROPRIÉTÉS MÉCANIQUES ---------------- */
{ id:"meca-1", chap:"meca", n:1, type:"QRU", titre:"Eau dans un tube que le liquide mouille mal",
  enonce:"On plonge verticalement dans l'eau un tube capillaire en plastique de 0,2 mm de diamètre intérieur. L'eau mouille mal ce plastique : l'angle de raccordement α entre l'eau et la paroi est tel que cos α = 0,6. La hauteur à laquelle l'eau s'élève dans le tube est de :",
  donnee:"Données : tension superficielle de l'eau σ = 0,07 N/m ; masse volumique de l'eau ρ = 1 000 kg/m³ ; g = 10 m/s².",
  items:["0,84 cm","4,2 cm","8,4 cm","14 cm","84 cm"],
  rep:"C",
  methode:["J'annote l'énoncé. Liquide qui monte dans un tube : loi de Jurin. Le mouillage est imparfait (cos α = 0,6) : il faut multiplier par cos α. L'énoncé donne le diamètre.",
           "J'écris la formule : h = 2σ × cos α / (ρ × g × r).",
           "Je convertis : r = 0,2 mm / 2 = 0,1 mm = 10⁻⁴ m.",
           "Je calcule : numérateur 2 × 0,07 × 0,6 = 0,084 ; dénominateur 1 000 × 10 × 10⁻⁴ = 1 ; h = 0,084 m = 8,4 cm."],
  expl:["Étape 3 : rayon mal converti, 0,1 mm écrit 10⁻³ m au lieu de 10⁻⁴ m (facteur 10).",
        "Étape 3 : le diamètre a été pris pour le rayon (r = 2 × 10⁻⁴ m), résultat divisé par 2.",
        "Étape 4 : bonne réponse.",
        "Étape 1 : le facteur cos α a été oublié. C'est la hauteur pour un mouillage parfait.",
        "Étape 3 : rayon mal converti dans l'autre sens, 10⁻⁵ m au lieu de 10⁻⁴ m."],
  pieges:"Mouillage imparfait : multiplier par cos α. Diamètre ÷ 2. mm × 10⁻³ → m. Un écart d'un facteur 10 signale une conversion." },

{ id:"meca-2", chap:"meca", n:2, type:"QRU", titre:"Montée d'alcool dans un tube capillaire",
  enonce:"Dans un laboratoire, on plonge verticalement un tube capillaire en verre dans de l'éthanol. Le mouillage est considéré comme parfait. L'éthanol monte de 2 cm dans le tube. Le diamètre intérieur du tube est de :",
  donnee:"Données : tension superficielle de l'éthanol σ = 0,024 N/m ; masse volumique de l'éthanol ρ = 800 kg/m³ ; g = 10 m/s².",
  items:["0,006 mm","0,3 mm","0,48 mm","0,6 mm","1,2 mm"],
  rep:"D",
  methode:["J'annote l'énoncé. Liquide qui monte dans un tube : loi de Jurin. On connaît h, on cherche le tube : le calcul est à l'envers. Attention, le liquide n'est pas de l'eau : ρ = 800 kg/m³.",
           "J'écris la formule et je l'inverse : h = 2σ / (ρ × g × r), donc r = 2σ / (ρ × g × h).",
           "Je convertis : h = 2 cm = 2 × 10⁻² m.",
           "Je calcule : r = 2 × 0,024 / (800 × 10 × 2 × 10⁻²) = 0,048 / 160 = 3 × 10⁻⁴ m = 0,3 mm.",
           "Je réponds à la question posée, le diamètre : 2 × r = 0,6 mm."],
  expl:["Étape 3 : la hauteur est restée en centimètres (2 au lieu de 0,02 m).",
        "Étape 5 : c'est le rayon. On a oublié de multiplier par 2 pour avoir le diamètre.",
        "Étape 1 : calcul fait avec la masse volumique de l'eau (1 000 kg/m³) au lieu de celle de l'éthanol.",
        "Étapes 4 et 5 : bonne réponse.",
        "Étape 5 : le diamètre a été multiplié par 2 une deuxième fois."],
  pieges:"Lire la masse volumique de l'énoncé, ne pas prendre 1 000 kg/m³ par réflexe. h en mètres. Rayon et diamètre, dans les deux sens. À l'envers : r = 2σ / (ρ g h)." },

{ id:"meca-3", chap:"meca", n:3, type:"QRU", titre:"Gouttelette d'aérosol",
  enonce:"Un nébuliseur produit des gouttelettes d'eau sphériques de 2 µm de diamètre, destinées à être inhalées. La tension superficielle de l'eau est de 72 mN/m. La différence de pression entre l'intérieur et l'extérieur d'une gouttelette est de :",
  items:["1,44 × 10² Pa","3,6 × 10⁴ Pa","7,2 × 10⁴ Pa","1,44 × 10⁵ Pa","1,44 × 10⁸ Pa"],
  rep:"D",
  methode:["J'annote l'énoncé. Une gouttelette : une interface, donc ΔP = 2σ / R. L'énoncé donne le diamètre et σ en mN/m.",
           "Je convertis : R = 2 µm / 2 = 1 µm = 10⁻⁶ m ; σ = 72 mN/m = 0,072 N/m.",
           "Je calcule : ΔP = 2 × 0,072 / 10⁻⁶ = 0,144 × 10⁶ = 1,44 × 10⁵ Pa.",
           "Je vérifie le sens. Une gouttelette minuscule doit avoir une surpression très forte : de l'ordre d'une atmosphère (10⁵ Pa), c'est cohérent."],
  expl:["Étape 2 : les µm ont été convertis comme des mm (10⁻³ m), facteur 1 000.",
        "Étapes 1 et 2 : le facteur 2 de la formule a été oublié et le diamètre pris pour le rayon.",
        "Étape 2 : le diamètre a été pris pour le rayon, résultat divisé par 2.",
        "Étape 3 : bonne réponse.",
        "Étape 2 : σ est resté en mN/m (72 au lieu de 0,072 N/m), facteur 1 000."],
  pieges:"Goutte : 2σ / R, une seule interface. Diamètre ÷ 2. µm × 10⁻⁶ et mN/m × 10⁻³. Plus la goutte est petite, plus la surpression est forte." },

{ id:"meca-4", chap:"meca", n:4, type:"QRU", titre:"Rayon d'une alvéole pulmonaire",
  enonce:"Une alvéole pulmonaire est assimilée à une petite sphère tapissée d'un film liquide contenant du surfactant. La tension superficielle de ce film est de 25 mN/m. La différence de pression entre l'intérieur et l'extérieur de l'alvéole est de 5 hPa. Le rayon de l'alvéole est de :",
  items:["0,05 mm","0,1 mm","0,2 mm","10 mm","100 mm"],
  rep:"B",
  methode:["J'annote l'énoncé. Une alvéole a une seule interface, comme une goutte : ΔP = 2σ / R. On connaît ΔP, on cherche R : le calcul est à l'envers.",
           "J'inverse la formule : R = 2σ / ΔP.",
           "Je convertis : σ = 25 mN/m = 0,025 N/m ; ΔP = 5 hPa = 500 Pa.",
           "Je calcule : R = 2 × 0,025 / 500 = 0,05 / 500 = 10⁻⁴ m = 0,1 mm."],
  expl:["Étape 2 : le facteur 2 a été oublié (R = σ / ΔP).",
        "Étape 4 : bonne réponse.",
        "Étape 1 : formule de la bulle de savon (4σ / R). L'alvéole n'a qu'une interface.",
        "Étape 3 : la pression est restée en hectopascals (5 au lieu de 500 Pa).",
        "Étape 3 : la tension superficielle est restée en mN/m (25 au lieu de 0,025 N/m)."],
  pieges:"Goutte et alvéole : 1 interface, 2σ / R. Bulle de savon : 2 interfaces, 4σ / R. 1 hPa = 100 Pa. 1 mN/m = 10⁻³ N/m." },

{ id:"meca-5", chap:"meca", n:5, type:"QRU", titre:"Deux bulles de savon",
  enonce:"On souffle deux bulles de savon, l'une de 1 cm de rayon, l'autre de 2 cm de rayon, avec la même eau savonneuse (tension superficielle σ = 0,03 N/m). On les relie ensuite par un petit tube muni d'un robinet fermé. Avant l'ouverture du robinet, la surpression dans la petite bulle dépasse celle de la grande de :",
  items:["0,06 Pa","3 Pa","6 Pa","12 Pa","18 Pa"],
  rep:"C",
  methode:["J'annote l'énoncé. Bulles de savon : deux interfaces, donc ΔP = 4σ / R. On demande un écart entre deux surpressions.",
           "Je convertis : R₁ = 1 cm = 10⁻² m ; R₂ = 2 cm = 2 × 10⁻² m.",
           "Je calcule chaque surpression : petite bulle 4 × 0,03 / 0,01 = 12 Pa ; grande bulle 4 × 0,03 / 0,02 = 6 Pa.",
           "Je calcule l'écart : 12 − 6 = 6 Pa.",
           "Je relie au cours. La pression est plus forte dans la petite bulle : si on ouvre le robinet, c'est la petite qui se vide dans la grande."],
  expl:["Étape 2 : les rayons sont restés en centimètres, facteur 100.",
        "Étape 1 : formule de la goutte (2σ / R) au lieu de 4σ / R. Surpressions de 6 et 3 Pa, écart de 3 Pa.",
        "Étape 4 : bonne réponse.",
        "Étape 4 : c'est la surpression de la petite bulle seule, pas l'écart.",
        "Étape 4 : les deux surpressions ont été additionnées au lieu d'être soustraites."],
  pieges:"Bulle de savon : 4σ / R. Lire ce qu'on demande : une surpression, un écart ou une somme. La petite bulle a la plus forte surpression et se vide dans la grande." },

{ id:"meca-6", chap:"meca", n:6, type:"QRU", titre:"Tension superficielle d'une eau savonneuse",
  enonce:"Un enfant souffle une bulle de savon de 4 cm de diamètre au bout d'une paille. Un capteur relié à la paille mesure une surpression de 4 Pa à l'intérieur de la bulle. La tension superficielle de l'eau savonneuse est de :",
  items:["0,02 N/m","0,04 N/m","0,08 N/m","0,32 N/m","2 N/m"],
  rep:"A",
  methode:["J'annote l'énoncé. Bulle de savon : 2 interfaces, ΔP = 4σ / R. On connaît ΔP, on cherche σ : le calcul est à l'envers. L'énoncé donne le diamètre.",
           "J'inverse la formule : σ = ΔP × R / 4.",
           "Je convertis : R = diamètre / 2 = 4 / 2 = 2 cm = 2 × 10⁻² m.",
           "Je calcule : σ = 4 × 0,02 / 4 = 0,02 N/m.",
           "Je vérifie l'ordre de grandeur. Une eau savonneuse a une tension superficielle de quelques centièmes de N/m, plus faible que l'eau pure (environ 0,07 N/m) : 0,02 N/m est cohérent."],
  expl:["Étape 4 : bonne réponse.",
        "Étapes 1 et 3 : formule de la goutte (2σ / R) ou diamètre pris pour le rayon. Les deux erreurs donnent 0,04 N/m.",
        "Étape 2 : le facteur 4 a été oublié (σ = ΔP × R).",
        "Étape 2 : formule mal inversée (σ = 4 × ΔP × R).",
        "Étape 3 : le rayon est resté en centimètres (2 au lieu de 0,02 m)."],
  pieges:"Bulle de savon : 4σ / R, à cause des deux interfaces. L'énoncé donne parfois le diamètre : diviser par 2. cm → m. Une tension superficielle reste de l'ordre de 10⁻² N/m." },

{
"id": "ener-1",
"titre": "Fontaine",
"type": "QRU",
"enonce": "Dans le jardin d'un hôpital, une fontaine projette un jet d'eau vertical. La buse est située 0,5 m au-dessus de la surface du bassin, et l'eau monte jusqu'à 2,3 m au-dessus de cette surface. Quelle est la vitesse de l'eau à la sortie de la buse ?",
"donnee": "Données : on considère le système conservatif ; g = 10 m·s⁻².",
"items": [
"3,0 m·s⁻¹",
"4,2 m·s⁻¹",
"6,0 m·s⁻¹",
"6,8 m·s⁻¹",
"36 m·s⁻¹"
],
"rep": "C",
"methode": [
"Encadrement : v² = 2gh doit valoir un nombre « rond ». Seul 6,0 donne v² = 36 = 2 × 10 × 1,8 ; on peut trancher avant tout calcul de racine.",
"J'annote l'énoncé. Départ (buse) : z = 0,5 m, v = ? · Sommet : z = 2,3 m, v = 0 (l'eau s'arrête avant de retomber) · système conservatif.",
"J'écris la formule. ½ m v² + m g z(buse) = m g z(sommet), donc v² = 2 g (z sommet − z buse) ; la masse se simplifie.",
"Je calcule la hauteur au-dessus de la buse : h = 2,3 − 0,5 = 1,8 m.",
"Je calcule : v² = 2 × 10 × 1,8 = 36, donc v = 6,0 m·s⁻¹."
],
"expl": [
"Étape 4 : le ½ appliqué à la vitesse au lieu de v² (6 ÷ 2 = 3,0).",
"Étape 2 : facteur 2 oublié, v = √(g h) = √18 ≈ 4,2.",
"Étape 4 : bonne réponse.",
"Étape 3 : hauteur de la buse oubliée, √(2 × 10 × 2,3) = √46 ≈ 6,8.",
"Étape 4 : racine oubliée. 36 est v² (en m²·s⁻²), pas v."
],
"pieges": "La hauteur se compte à partir du point de départ (la buse), pas du sol : c'est l'inverse du piège de 2026, où il fallait ajouter l'altitude de départ. Au point le plus haut, la vitesse est nulle. Ne pas oublier la racine : v² = 36 donne v = 6.",
"chap": "ener",
"n": 1
},
{
"id": "ener-2",
"titre": "Ascenseur qui descend",
"type": "QRM",
"enonce": "La cabine d'un ascenseur de l'hôpital, chargée d'un lit et de son patient (masse totale 500 kg), descend du 4e étage au rez-de-chaussée, soit 12 m, en 20 s. La descente se fait en ligne droite et à vitesse constante.",
"donnee": "On prendra g = 10 m·s⁻².",
"items": [
"pendant la descente, l'énergie cinétique de la cabine chargée vaut 90 J",
"entre le 4e étage et le rez-de-chaussée, son énergie potentielle de pesanteur diminue de 60 kJ",
"le travail du poids au cours de la descente est résistant",
"l'énergie mécanique de la cabine chargée se conserve pendant la descente",
"la somme des travaux des forces qui s'exercent sur la cabine chargée est nulle"
],
"rep": "ABE",
"methode": [
"J'annote l'énoncé. m = 500 kg · départ z = 12 m · arrivée z = 0 · vitesse constante · forces : poids et tension du câble (le moteur retient la cabine), donc le système n'est pas conservatif.",
"Je calcule la vitesse : v = d / Δt = 12 / 20 = 0,6 m·s⁻¹, la même à chaque étage.",
"J'écris Ec : ½ × 500 × 0,6² = 250 × 0,36 = 90 J.",
"J'écris la variation d'Ep : m g (z arrivée − z départ) = 500 × 10 × (0 − 12) = −60 000 J, soit une diminution de 60 kJ.",
"Travail du poids : le poids est vers le bas, le déplacement aussi, θ = 0°, cos θ = 1 → travail moteur.",
"Bilan : EM = Ec + Ep. Ec est constante et Ep diminue, donc EM diminue.",
"Vitesse constante : la variation d'Ec est nulle, donc la somme des travaux est nulle (théorème de l'énergie cinétique)."
],
"expl": [
"Étapes 2 et 3.",
"Étape 4.",
"Étape 5 : sens inversé. Le poids est résistant en montée ; en descente, il est moteur.",
"Étape 6 : « se conserve » au lieu de « diminue ». Vitesse constante n'implique pas un système conservatif.",
"Étape 7."
],
"pieges": "Vitesse constante ≠ système conservatif : Ec ne bouge pas, mais Ep change, donc EM change. C'est le miroir de la QRM 2025 : en montée EM augmente, en descente EM diminue. Ec a la même valeur à tous les étages.",
"chap": "ener",
"n": 2
},

},

"enonce": "Le 1-méthylcyclohexène est traité, dans quatre expériences séparées, par les réactifs ci-dessous. Indiquez la ou les propositions exactes.",
"items": [
"dans P, l'atome de brome est porté par le carbone qui porte aussi le groupe méthyle",
"R est un alcool tertiaire",
"dans S, les deux groupes OH sont situés du même côté du cycle",
"l'ozonolyse conduit à deux molécules distinctes",
"T possède une fonction aldéhyde et une fonction cétone"
],
"rep": "ACE",
"methode": [
"Je numérote : C1 porte le CH₃ → 0 H ; C2 → 1 H. Le groupe va sur C1 (moins de H), sauf exceptions.",
"HBr → Br sur C1. BH₃ = exception → OH sur C2. Phrase 1.",
"KMnO₄ dilué : pas de pont, il pose les 2 OH d'un coup → même côté. Phrase 2.",
"O₃ + Me₂S : C1 (0 H) → cétone ; C2 (1 H) + réducteur → aldéhyde. C=C dans le cycle → une seule molécule. Phrase 4."
],
"expl": [
"Br sur le C qui a le moins de H = C1, celui du CH₃.",
"BH₃ = exception : OH sur C2, lié à 2 C → alcool secondaire. (Avec H₂O + H⁺, OH sur C1 → tertiaire.)",
"Pas de pont → même côté. Pas de coupure.",
"Couper un cycle, c'est ouvrir un bracelet → une seule molécule, avec un C=O à chaque bout.",
"Cétone sur C1, aldéhyde sur C2 : 6-oxoheptanal (7 C au départ, 7 C à l'arrivée)."
],
"pieges": "BH₃ est une exception (OH sur le C qui a le plus de H). C=C dans un cycle = 1 seule molécule après coupure.",
"chap": "alc",
"n": 9
