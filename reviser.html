"methode": [
"Lire la cible : un groupement placé en méta d'un autre est posé après un méta-orienteur ; un ortho/para-orienteur posé trop tôt piège tout l'enchaînement.",
"COOH : CH₃ + KMnO₄ concentré (ou RMgX + CO₂ puis H₃O⁺) ; CrO₃/pyridine s'arrête à l'aldéhyde.",
"Halogénation, alkylation, acylation sans acide de Lewis → pas de réaction."
],
"expl": [
"Faux. Le brome est posé en premier : il oriente en ortho/para, donc la nitration de l'étape 2 place NO₂ en para du Br. Dans G, Br et NO₂ sont en méta.",
"Faux. Nitration du toluène : CH₃ est activant, NO₂ se place en para (ou ortho) du CH₃, donc en para du futur COOH. Dans G, NO₂ est en méta de COOH.",
"Vrai. Toluène → KMnO₄ concentré à chaud : acide benzoïque (COOH, −M, méta-orienteur) → nitration en méta : acide 3-nitrobenzoïque → bromation : COOH et NO₂ envoient tous deux le brome sur la position méta commune (5). On obtient G.",
"Faux. CrO₃ dans la pyridine oxyde un CH₃ porté par le cycle en aldéhyde (CHO), pas en acide carboxylique. On obtiendrait le 3-bromo-5-nitrobenzaldéhyde.",
"Faux. Les étapes 1 à 5 sont correctes (organomagnésien + CO₂ puis hydrolyse = acide benzoïque, puis nitration en méta), mais Br₂ seul ne réagit pas avec le cycle : il faut un acide de Lewis (FeBr₃) pour générer l'électrophile Br⁺."
],

"enonce": "Soit l'enchaînement F → G → H → I ci-dessous. Indiquez la ou les propositions exactes.",
"items": [
"La réaction de F à G est une acylation de Friedel et Crafts dont l'électrophile est l'ion acylium",
"Le passage de G à H est une réduction de Wolff-Kishner",
"Pour passer de F à G, AlCl₃ doit être utilisé en quantité stœchiométrique car une partie est piégée par l'oxygène du C=O",
"Dans I, l'atome de brome est fixé sur le cycle en para de la chaîne propyle",
"Le traitement de H par H₂, Pd/C à 25 °C et pression atmosphérique conduit au propylcyclohexane"
],
"rep": "AC",
"methode": [
"AlCl₃ catalytique → halogénation, alkylation ; stœchiométrique → acylation.",
"Zn/Hg/HCl = Clemmensen (acide) ; NH₂–NH₂/NaOH = Wolff-Kishner (basique).",
"hν + chaleur → carbone en α de la chaîne ; acide de Lewis → cycle.",
"Cycle benzénique réduit seulement à pression et température très élevées ; une C=C hors du cycle se réduit à 25 °C."
],
"expl": [
"Vrai. Un chlorure d'acide RCOCl + AlCl₃ génère l'ion acylium R–C≡O⁺, électrophile qui se fixe sur le cycle : acylation de Friedel et Crafts.",
"Faux. Zn/Hg en milieu HCl = réduction de Clemmensen (milieu acide). Wolff-Kishner = hydrazine NH₂–NH₂ en milieu basique (NaOH). Les deux remplacent C=O par CH₂, mais le nom ne correspond pas aux réactifs.",
"Vrai. L'oxygène du C=O (donneur d'électrons) complexe AlCl₃ : il faut donc l'acide de Lewis en quantité stœchiométrique, contrairement à l'alkylation où il est catalytique.",
"Faux. Br₂ + lumière hν + température élevée, sans acide de Lewis : halogénation du carbone en α du cycle (celui directement lié au cycle), pas une substitution sur le cycle. Br est sur le CH de la chaîne.",
"Faux. H₂/Pd/C à température et pression ordinaires ne réduit pas le cycle benzénique : il faut une pression très élevée (environ 200 atm) et une température élevée."
],
"pieges": "Zn/Hg/HCl = Clemmensen, NH₂NH₂/NaOH = Wolff-Kishner. Br₂ + lumière → carbone α ; Br₂ + FeBr₃ → cycle. H₂/Pd/C à 25 °C ne réduit pas le cycle.",

"methode": [
"Avant la chimie : mêmes atomes, même charge totale, double flèche ↔ (⇌ → faux).",
"Donneur (O, N, Cl) → + sur lui, − sur le cycle ; attracteur (C=O, NO₂) → − sur O, + sur le cycle.",
"Sur le cycle, la charge peut être en ortho ou en para : les deux sont justes ; jamais en méta."
],
"expl": [
"Vrai. L'oxygène collé au cycle a des doublets libres : c'est un donneur (+M). Il forme la double liaison C=O, devient + (3 liaisons), et le doublet repoussé dans le cycle peut glisser jusqu'au carbone para, qui porte le −. Ortho ou para sont tous deux possibles. Atomes et charge totale conservés.",
"Vrai. NO₂ est attracteur (−M) : une double liaison du cycle part vers l'azote (C=N), les deux oxygènes portent chacun un −, l'azote garde son +, et le carbone ortho du cycle devient +. Bilan : +1 −2 +1 = 0, comme au départ.",
"Faux. Le chlore a des doublets libres : il est donneur (+M). Dans la forme correcte, c'est lui qui porte le + (il a donné un doublet) et le cycle porte le −. Ici les charges sont inversées.",
"Faux. Les deux dessins seraient justes, mais ils sont reliés par ⇌ (deux flèches = équilibre entre deux molécules différentes). Une relation de mésomérie s'écrit avec une double flèche ↔.",
"Vrai. Le C=O de la cétone est attracteur (−M) : les électrons du cycle partent vers l'oxygène (O⁻), et le + du cycle peut se placer en para. Atomes et charge totale conservés."
],
"pieges": "Charges inversées pour un halogène (il est donneur, donc +). ⇌ au lieu de ↔. Une charge en para est aussi juste qu'en ortho.",

"Vrai. Le carbone qui porte le OH de la chaîne a 4 substituants différents (OH, CH₂–NH–CH₃, cycle, H) : carbone asymétrique, molécule chirale.",
"Faux. Priorités : OH (O) en 1 ; CH₂–NH–CH₃ en 2, car son premier carbone porte un N, plus lourd que les C du cycle ; le cycle en 3 ; H en 4, en arrière. On lit 1 → 2 → 3 dans le sens des aiguilles d'une montre → R, pas S.",
"Vrai. L'oxygène du OH est collé directement au cycle : ses doublets libres se conjuguent avec le cycle → +M (donneur).",
"Faux. Ce OH est porté par un carbone sp³ (le carbone asymétrique), séparé du cycle : pas de conjugaison, donc pas d'effet mésomère, seulement un effet inductif (−I).",
"Vrai. OH sur le cycle = phénol ; OH sur un carbone sp³ = alcool ; N lié à deux carbones (CH₂ et CH₃) et un H = amine secondaire."
],
"pieges": "Le cycle n'est pas forcément prioritaire : un C qui porte un N passe devant. Deux OH dans la même molécule n'ont pas le même effet.",
"chap": "benz",
"n": 3

"rep": "ACD",
"methode": [
"Claisen : je numérote 1, 2, 3 à partir de l'O ; le cycle se lie au 3.",
"Claisen = chaleur seule. Williamson = phénol + NaOH + R–X → éther.",
"OR face à un halogène ou un alkyle : c'est OR qui décide."
],
"expl": [
"Vrai. On numérote la chaîne à partir de l'O : C1, C2=C3. La liaison O–C1 se coupe, le cycle (en ortho, la place para est prise par Cl) se lie à C3, et la double liaison passe en C1=C2. Le C3 porte l'éthyle : c'est G.",
"Faux. Le réarrangement de Claisen se fait par simple chauffage, sans réactif ni catalyseur.",
"Vrai. OR (+M) et Cl (+M mais aussi −I) sont en para l'un de l'autre et ne visent pas les mêmes places. C'est l'éther, plus fortement donneur, qui l'emporte : NO₂ se place en ortho de l'oxygène, comme dans J.",
"Vrai. NaOH transforme le phénol en phénate (nucléophile), qui fait une substitution nucléophile sur le carbone porteur du Br : on obtient l'éther F (réaction de Williamson).",
"Faux. Dans H, la chaîne est accrochée par son ancien C1, comme si elle avait été recopiée : sans inversion, ce n'est pas un Claisen."
],
"pieges": "La chaîne recopiée sans inversion. Un catalyseur inventé pour Claisen. Sur l'orientation, l'halogène ne l'emporte pas sur l'éther.",

"expl": [
"Vrai. Dans G, l'éthyle (donneur) vise ortho/para — para est pris par SO₃H — et SO₃H (attracteur) vise méta. Les deux visent la même place : en ortho de l'éthyle. C'est H.",

"Faux. Br₂ + lumière + chaleur, sans acide de Lewis : le brome se fixe sur le carbone α de la chaîne, pas sur le cycle.",
"Faux. L'éthyle est donneur : après Birch, le carbone qui le porte garde sa double liaison (sp²)."

"expl": [
"Vrai. OH est collé au cycle et a des doublets libres : c'est un donneur (+M). Un doublet de l'O forme la double liaison C=O ; l'O a alors 3 liaisons et porte le +. La double liaison du cycle qu'il repousse part sur le carbone voisin, qui porte le − en ortho. Ce carbone n'a plus de double liaison. Charge totale : +1 −1 = 0, comme au départ.",
"Faux. CHO est attracteur (−M) : la double liaison C=O part sur l'O, qui porte le −, et une double liaison du cycle vient remplacer celle du C=O. Le carbone du cycle qui perd sa double liaison (ici le para) doit porter un +. Il manque : à gauche la charge totale vaut 0, à droite −1.",
"Vrai. Même logique qu'avec un cycle : NH₂ est donneur, il forme C=N et porte le + (4 liaisons sur N). La double liaison C=C est repoussée vers le carbone du bout, qui porte le −. Atomes identiques, charge totale 0 des deux côtés.",

"Faux. Le F est bien donneur et porte bien le +. Mais le − est placé sur un carbone qui a encore une double liaison (4 liaisons + un doublet : impossible). Le − doit être sur le seul carbone du cycle sans double liaison, ici l'autre ortho."

"type": "QRM",
"enonce": "Parmi les propositions suivantes, quelles sont celles qui sont exactes ?",
"items": [
"Le composé G résulte d'une réaction de Wittig.",
"L'ylure utilisé présente une forme mésomère.",
"Dans le cas d'un ylure stabilisé, la réaction de Wittig se fait facilement sur les cétones.",
"H présente une fonction amine.",
"L'ylure est obtenu en traitant le sel de phosphonium correspondant par un acide."
],
"rep": "ABD",
"methode": [
"Le C riche de l'ylure : flèche vers le C du C=O.",
"Nouvelle liaison C–C ; O⁻ et P⁺ voisins.",
"Le P part avec l'O (Ph₃P=O) → G : cyclohexyle–CH=CH–C≡N (l'ancien C=O est devenu C=C).",
"LiAlH₄ : C≡N → CH₂–NH₂ → H : cyclohexyle–CH=CH–CH₂–NH₂ (amine)."
],
"expl": [
"Vrai. Ylure Ph₃P=CH–CN sur un aldéhyde : le CH–CN remplace l'O → alcène.",
"Vrai. Le C de l'ylure porte un CN : charge étalée sur le CN → ylure stabilisé (forme mésomère).",
"Faux. Ylure stabilisé : aldéhydes oui, cétones non.",
"Vrai. LiAlH₄ réduit le nitrile C≡N en amine CH₂–NH₂.",
"Faux. Sel de phosphonium + base forte (NaNH₂, BuLi) → ylure ; un acide ne peut pas arracher le H."
],
"pieges": "CN, COOEt sur le C de l'ylure → stabilisé → pas de cétones. LiAlH₄ : nitrile → amine ; ester → alcool primaire. Ylure = sel de phosphonium + base.",

"La réaction de Baeyer-Villiger de la cyclopentanone par CF₃COOOH, en milieu acide, conduit à une lactone dont le cycle comporte 6 atomes.",
"Lors de la réaction de Baeyer-Villiger de la 1-phénylpropan-2-one (Ph–CH₂–CO–CH₃), c'est le groupe méthyle qui migre.",
"Le traitement d'un alcool aliphatique par la soude (NaOH) conduit à l'alcoolate correspondant.",
"L'action de NaBH₄ à 25 °C sur la cyclopent-2-én-1-one conduit à un alcool insaturé.",
"La réduction de Wolff-Kishner d'une cétone s'effectue en milieu acide."
],
"rep": "AD",
"methode": [
"Baeyer-Villiger : tertiaire > secondaire > phényle > primaire > méthyle ; cyclique → cycle + 1.",
"NaOH : alcool non, phénol oui.",
"Wolff-Kishner = base ; Clemmensen = acide."
],
"expl": [
"Vrai. Cyclopentanone (5 atomes) + 1 O glissé → lactone à 6 atomes.",
"Faux. Benzyle (Ph–CH₂, primaire) migre avant méthyle : l'O se place côté CH₂Ph → acétate de benzyle.",
"Faux. NaOH ne déprotone pas un alcool simple (il le fait sur un phénol).",
"Vrai. NaBH₄ à 25 °C ne réduit que le C=O de l'énone → alcool avec la C=C.",
"Faux. Wolff-Kishner : NH₂NH₂ + OH⁻, milieu basique (c'est Clemmensen qui est acide)."
],

"id": "ald-s2-4",
"serie": 2,
"titre": "Cétolisation puis CH₃Li",
"type": "QRM",
"enonce": "Parmi les propositions suivantes, quelles sont celles qui sont exactes ?",
"items": [
"Le carbanion intermédiaire est un carbanion primaire.",
"G présente des stéréoisomères Z et E.",
"H possède une fonction alcool tertiaire.",
"H est chirale.",
"Seule la cyclohexanone peut fournir un carbanion dans ces conditions."
],
"rep": "BCDE",
"methode": [
"1) base : ⊖ sur un α du cycle.",
"Le ⊖ se pose sur l'aldéhyde : cétol.",
"2) chaleur : crotonisation → G.",
"CH₃Li direct sur le C=O, puis H₃O⁺ → H."
],
"expl": [
"Faux. Le ⊖ est sur un CH₂ du cycle, relié à 2 carbones (le C=O et le CH₂ suivant) → carbanion secondaire.",
"Vrai. C=C de G : côté cycle, deux branches différentes (vers le C=O / vers le CH₂) ; côté chaîne, H et tert-butyle → Z/E.",
"Vrai. CH₃Li va direct sur le C=O (1,2) → l'ancien C de la cétone porte OH + CH₃ → alcool tertiaire.",
"Vrai. Ce carbone porte OH, CH₃ et deux branches du cycle différentes → 4 groupes différents → chiral.",
"Vrai. Le 2,2-diméthylpropanal n'a aucun H sur le carbone voisin du C=O (c'est un C qui porte 3 méthyles) : il ne peut que recevoir."
],
"pieges": "Pas de H en α → la molécule ne peut que recevoir. Primaire / secondaire : compter les carbones collés au carbone ⊖ (le C=O compte).",

const LETTERS = ["A","B","C","D","E","F"];
const STORE_KEY = "reviser-qcm-v1";
let results = {};
try { results = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch(e){ results = {}; }
function saveResults(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(results)); } catch(e){} }

const state = { course:null, chap:"all", tab:"fiches", qType:"all", qStatus:"all", serie:1 };
const selections = {};   // id -> Set des lettres cochées
const validated = {};    // id -> true quand corrigé à l'écran

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const findMat = id => { for (const m of MODULES) for (const x of m.matieres) if (x.id === id) return x; return null; };
const chapsOf = d => Array.isArray(d.chap) ? d.chap : [d.chap];
const inChap = d => state.chap === "all" || chapsOf(d).includes(state.chap);

/* ---------- couleurs des cours ---------- */
const COURSE_COLORS = ["#5B5BD6","#0E9F9A","#E5484D","#F76B15","#8E4EC6","#3E63DD","#D6409F"];
const chapIndex = (c, id) => c.chapitres.findIndex(ch => ch.id === id);
const courseColor = (c, id) => { const ch = c.chapitres.find(x=>x.id===id); return (ch && ch.color) || COURSE_COLORS[Math.max(0,chapIndex(c,id)) % COURSE_COLORS.length]; };
const inC = (d, id) => chapsOf(d).includes(id);
const plural = (n, w) => n + " " + w + (n>1 && !/s$/.test(w) ? "s" : "");

/* ---------- 1. les matières ---------- */
function renderHome(){
  let html = "";
  MODULES.forEach(mod => {
    html += `<div class="module"><div class="module-head"><h2>Module ${mod.label.slice(1)}</h2><span>${plural(mod.matieres.length,"matière")}</span></div><div class="grid">`;
    mod.matieres.forEach(m => {
      const c = CONTENU[m.id];
      const ini = m.title.split(/[\s']+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0].toUpperCase()).join("");
      const sub = c ? `${plural(c.chapitres.length,"cours")} · <b style="color:#E2462A">${c.qcm.length} QCM</b>` : "Bientôt disponible";
      html += `<a class="mat ${c?"":"soon"}" href="#${m.id}" style="--c:${m.color}">
        <span class="ini">${ini}</span><span><h3>${m.title}</h3><span class="sub">${sub}</span></span><span class="go">→</span></a>`;
    });
    html += `</div></div>`;
  });
  document.getElementById("homeContent").innerHTML = html;
}

/* ---------- 2. les cours d'une matière ---------- */
function renderMatiere(){
  const m = findMat(state.course), c = CONTENU[state.course];
  document.body.style.setProperty("--acc", m.color);
  document.getElementById("matHead").innerHTML =
    `<h1>${m.title}</h1><p>${MODULES.find(x=>x.matieres.includes(m)).label} · ${c ? plural(c.chapitres.length,"cours") : "aucun cours pour l'instant"}</p>`;
  const box = document.getElementById("courseTiles");
  if (!c){ box.innerHTML = `<div class="empty">Rien pour l'instant. Les cours de cette matière apparaîtront ici dès qu'ils seront ajoutés.</div>`; return; }
  box.innerHTML = c.chapitres.map((ch,i) => {
    const nh = c.herve.filter(d=>inC(d,ch.id)).length, nf = c.fiches.filter(d=>inC(d,ch.id)).length;
    const qs = c.qcm.filter(q=>q.chap===ch.id);
    const ok = qs.filter(q=>results[q.id]==="ok").length, ko = qs.filter(q=>results[q.id]==="ko").length;
    const pct = n => qs.length ? 100*n/qs.length : 0;
    const base = `#${state.course}/${ch.id}`;
    return `<a class="ctile" href="${base}" style="--cc:${courseColor(c,ch.id)}">
      <div class="top" data-n="${i+1}"><span class="num">Cours ${i+1}</span><h3>${ch.label}</h3><div class="code">${ch.code||""}</div></div>
      <div class="bot">
        <div class="tilestats">
          <span class="tq"><b>${qs.length}</b> QCM</span>
          <span class="bar2"><i style="width:${pct(ok)}%;background:var(--ok)"></i><i style="width:${pct(ko)}%;background:var(--ko)"></i></span>
          <span class="tq2">${ok}/${qs.length} réussis</span>
        </div>
        <div class="tilesmall"><span><i style="background:#1E88FF"></i>${plural(courseDocsFor(c,ch.id),"document")}</span></div>
        <div class="enter"><span>Entrer dans le cours</span><span>→</span></div>
      </div></a>`;
  }).join("");
}

const courseDocsFor = (c, id) => [...c.herve, ...c.fiches, ...c.entrainement].filter(d => inC(d,id)).length;

/* ---------- 3. un cours ---------- */
function renderCourse(){
  const m = findMat(state.course), c = CONTENU[state.course];
  const ch = c.chapitres.find(x => x.id === state.chap);
  const i = chapIndex(c, ch.id);
  document.body.style.setProperty("--cc", courseColor(c, ch.id));
  document.getElementById("backMat").setAttribute("href", "#" + state.course);
  document.getElementById("courseHead").innerHTML = `<small>${m.title} · Cours ${i+1}</small><b>${ch.label}</b>`;
  const tabs = document.getElementById("tabs");
  const cnt = arr => arr.filter(inChap).length;
  document.getElementById("nDocs").textContent = plural(courseDocs(c).length, "document");
  document.getElementById("nTrain").textContent = cnt(c.qcm) + " questions";
  tabs.querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === state.tab);
    b.onclick = () => go("#" + state.course + "/" + state.chap + "/" + b.dataset.tab);
  });
  const panel = document.getElementById("panel");
  panel.className = "panel k-" + state.tab;
  if (state.tab === "docs") panel.innerHTML = renderDocs(c);
  else renderTrain(c, panel);
}

/* ---------- onglet Documents : 3 rubriques, dans l'ordre où on s'en sert ---------- */
const DOC_CATS = [
  { id:"comprendre", n:1, titre:"Comprendre", sous:"ce qui sert à expliquer le cours", color:"#7C5CFF", bg:"#EFEAFF" },
  { id:"apprendre",  n:2, titre:"Apprendre",  sous:"ce qu'on relit et qu'on retient",  color:"#1E88FF", bg:"#E3F0FF" },
  { id:"cibler",     n:3, titre:"Cibler le concours", sous:"ce qui tombe, comment ça tombe, les exercices sur papier", color:"#0E9F9A", bg:"#DDF5F2" },
];
function catOf(d, from){
  if (d.cat) return d.cat;
  if (from === "herve") return "comprendre";
  if (from === "entrainement") return "cibler";
  return /Ce_qui_risque|Annales_par_rubrique/.test(d.fichier) ? "cibler" : "apprendre";
}
function courseDocs(c){
  const out = [];
  [["herve",c.herve],["fiches",c.fiches],["entrainement",c.entrainement]].forEach(([from,list]) =>
    list.filter(inChap).forEach(d => out.push({ d, cat: catOf(d, from) })));
  return out;
}
function renderDocs(c){
  const all = courseDocs(c);
  if (!all.length) return `<div class="empty">Pas encore de document pour ce cours.</div>`;
  return DOC_CATS.map(k => {
    const docs = all.filter(x => x.cat === k.id).map(x => x.d);
    return `<section class="dsec" style="--k:${k.color};--k-bg:${k.bg}">
      <div class="dhead"><span class="dn">${k.n}</span><span><b>${k.titre}</b><small>${k.sous}</small></span></div>
      ${docs.length ? `<div class="docs">${docs.map(docHTML).join("")}</div>` : `<div class="dnone">Rien dans cette rubrique pour ce cours.</div>`}
    </section>`;
  }).join("");
}

function docHTML(d){
  return `<a class="doc" href="${encodeURI(d.fichier)}" target="_blank" rel="noopener">
    <span class="ic">${/\.png$/i.test(d.fichier) ? "IMG" : "PDF"}</span><span><b>${esc(d.titre)}</b><small>${esc(d.desc||"")}</small></span></a>`;
}
/* ---------- rubrique M'entraîner ---------- */
function seriesOf(c){ return [...new Set(c.qcm.filter(inChap).map(q=>q.serie).filter(Boolean))].sort(); }
function trainPool(c){
  const all = c.qcm.filter(inChap), ss = seriesOf(c);
  if (!ss.length) return all;
  if (!ss.includes(+state.serie)) state.serie = ss[0];
  return all.filter(q => q.serie === +state.serie);
}
function renderTrain(c, panel){
  const pdfs = c.entrainement.filter(inChap);
  const pool = trainPool(c);
  const ss = seriesOf(c);
  const qs = pool;
  const nOk = pool.filter(q => results[q.id] === "ok").length;
  const nKo = pool.filter(q => results[q.id] === "ko").length;
  const pct = n => pool.length ? (100*n/pool.length) : 0;
  const chip = (key,val,label) => `<button class="chip ${state[key]===val?"on":""}" data-k="${key}" data-v="${val}">${label}</button>`;

  const tabsSerie = ss.length > 1 ? `<div class="serietabs">${ss.map(n => {
      const qn = c.qcm.filter(q => inChap(q) && q.serie === n);
      const ok = qn.filter(q => results[q.id] === "ok").length;
      return `<button class="stab ${+state.serie===n?"on":""}" data-serie="${n}"><b>Série ${n}</b><small>${qn.length} QCM · ${ok} réussi${ok>1?"s":""}</small></button>`;
    }).join("")}</div>` : "";
  panel.innerHTML = tabsSerie + `
    <div class="qhero">
      <span class="big">${pool.length}</span>
      <span class="txt"><b>QCM interactifs</b><span>Coche, valide, lis la correction.</span>
        <div class="progress" style="margin-top:6px;color:#fff">
          <div class="bar"><i style="width:${pct(nOk)}%;background:#fff"></i><i style="width:${pct(nKo)}%;background:#600"></i></div>
          <span>${nOk} réussie${nOk>1?"s":""} · ${nKo} à refaire · ${pool.length}</span>
          <button class="linkbtn" id="resetAll">Remettre à zéro</button>
        </div></span>
    </div>
    <div id="qList">${qs.map(qHTML).join("") || `<div class="empty">Pas encore de QCM pour ce cours.</div>`}</div>`;

  panel.querySelectorAll(".stab").forEach(b => b.onclick = () => { state.serie = +b.dataset.serie; renderCourse(); });
  panel.querySelectorAll(".qtools .chip").forEach(b => b.onclick = () => { state[b.dataset.k] = b.dataset.v; renderCourse(); });
  panel.querySelector("#resetAll").onclick = () => {
    if (!confirm("Effacer la progression des QCM affichés ?")) return;
    pool.forEach(q => { delete results[q.id]; delete selections[q.id]; delete validated[q.id]; });
    saveResults(); renderCourse();
  };
  qs.forEach(q => wireQ(q));
}

function chapLabel(id){ const c = CONTENU[state.course]; const ch = c.chapitres.find(x=>x.id===id); return ch ? ch.label : id; }

function qHTML(q){
  const sel = selections[q.id] || new Set();
  const done = !!validated[q.id];
  const st = results[q.id];
  const stTxt = st === "ok" ? `<span class="st ok">réussie</span>` : st === "ko" ? `<span class="st ko">à refaire</span>` : `<span class="st">${q.type}</span>`;
  let nBon=0, nErr=0, nOubli=0;
  const items = q.items.map((t,i) => {
    const L = LETTERS[i];
    let cls = sel.has(L) ? "sel" : "";
    let why = "", mark = "", Lbox = L;
    if (done){
      const juste = q.rep.includes(L), coche = sel.has(L);
      if (juste && coche){ cls="r-ok mine"; nBon++; Lbox="✓"; mark=`<span class="mark ok">✓ Ta réponse · juste</span>`; }
      else if (!juste && coche){ cls="r-ko mine"; nErr++; Lbox="✗"; mark=`<span class="mark ko">✗ Ta réponse · fausse</span>`; }
      else if (juste && !coche){ cls="r-miss"; nOubli++; mark=`<span class="mark miss">! Oubliée · elle était juste</span>`; }
      else { cls="r-neutral"; mark=`<span class="mark neutral">Pas cochée · fausse, bien vu</span>`; }
      why = `<div class="why">${esc(q.expl[i])}</div>`;
    }
    return `<button class="item ${cls}" data-l="${L}" ${done?"disabled":""}><span class="L">${Lbox}</span><span class="txt">${mark}${esc(t)}${why}</span></button>`;
  }).join("");
  let verdict = "";
  if (done){
    const ok = sameSet(sel, q.rep);
    const stat = (n,lab,c) => `<span class="vs ${c}"><b>${n}</b>${lab}</span>`;
    verdict = `<div class="verdict ${ok?"ok":"ko"}">
      <div class="vtop"><span class="vicon">${ok?"✓":"✗"}</span><span>${ok ? "Juste, sans faute !" : "Pas tout à fait"}<small>Réponse${q.rep.length>1?"s":""} attendue${q.rep.length>1?"s":""} : ${q.rep.split("").join(", ")}</small></span></div>
      <div class="vstats">${stat(nBon,"juste"+(nBon>1?"s":""),"g")}${stat(nErr,"erreur"+(nErr>1?"s":""),"r")}${stat(nOubli,"oubliée"+(nOubli>1?"s":""),"o")}</div>
    </div>`;
  }
  return `<div class="q ${done?"done":""} ${q.type==="QRU"?"qru":""}" id="q-${q.id}">
    <div class="q-head"><b>Exercice ${q.n} · ${esc(q.titre)}</b>${stTxt}</div>
    <div class="q-body">
      <p class="q-enonce">${esc(q.enonce)}${q.donnee ? `<span class="data">${esc(q.donnee)}</span>` : ""}</p>
      ${q.extra || ""}
      <div class="hint">${q.type === "QRU" ? "QRU · une seule réponse exacte" : "QRM · une ou plusieurs réponses exactes"}</div>
      ${verdict}
      ${items}
      <div class="actions">
        ${done ? `<button class="btn ghost" data-act="redo">Refaire la question</button>`
               : `<button class="btn main" data-act="check" ${sel.size?"":"disabled"}>Valider</button>`}
      </div>
      ${done ? `<div class="corr">${q.corrExtra || ""}
        <div class="box meth"><h4>Méthode pas à pas</h4><ol>${q.methode.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
        <div class="box trap"><h4>Pièges</h4>${esc(q.pieges)}</div></div>` : ""}
    </div></div>`;
}

function sameSet(set, rep){ return set.size === rep.length && rep.split("").every(L => set.has(L)); }

function wireQ(q){
  const el = document.getElementById("q-" + q.id);
  if (!el) return;
  el.querySelectorAll(".item").forEach(b => b.onclick = () => {
    if (validated[q.id]) return;
    const s = selections[q.id] || (selections[q.id] = new Set());
    const L = b.dataset.l;
    if (q.type === "QRU"){ const had = s.has(L); s.clear(); if (!had) s.add(L); }
    else { s.has(L) ? s.delete(L) : s.add(L); }
    redrawQ(q);
  });
  const btn = el.querySelector("[data-act]");
  if (btn) btn.onclick = () => {
    if (btn.dataset.act === "check"){
      validated[q.id] = true;
      results[q.id] = sameSet(selections[q.id] || new Set(), q.rep) ? "ok" : "ko";
      saveResults();
    } else {
      delete validated[q.id]; selections[q.id] = new Set();
    }
    redrawQ(q);
    refreshProgress();
  };
}
function redrawQ(q){
  const el = document.getElementById("q-" + q.id);
  const tmp = document.createElement("div"); tmp.innerHTML = qHTML(q);
  el.replaceWith(tmp.firstElementChild);
  wireQ(q);
}
function refreshProgress(){
  const c = CONTENU[state.course];
  const pool = trainPool(c);
  const nOk = pool.filter(q => results[q.id] === "ok").length;
  const nKo = pool.filter(q => results[q.id] === "ko").length;
  const bar = document.querySelector(".progress .bar");
  if (!bar) return;
  bar.children[0].style.width = (100*nOk/pool.length) + "%";
  bar.children[1].style.width = (100*nKo/pool.length) + "%";
  bar.nextElementSibling.textContent = `${nOk} réussie${nOk>1?"s":""} · ${nKo} à refaire · ${pool.length}`;
  document.getElementById("nTrain").textContent = c.qcm.filter(inChap).length + " questions";
}

/* ---------- navigation (#matiere/onglet) ---------- */
/* Navigation pilotée en JavaScript : fonctionne en ligne, en fichier local
   et dans les aperçus (où changer l'adresse de la page est bloqué). */
let currentHash = "";
try { currentHash = location.hash; } catch(e){}
function go(hash){
  currentHash = hash;
  try { if (location.hash !== hash) history.pushState(null, "", hash || location.pathname); } catch(e){}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (a){ e.preventDefault(); go(a.getAttribute("href") === "#" ? "" : a.getAttribute("href")); }
});
window.addEventListener("popstate", () => { try { currentHash = location.hash; } catch(e){} route(); });

function show(v){ ["viewHome","viewMatiere","viewCourse"].forEach(x => document.getElementById(x).classList.toggle("hidden", x !== v)); }
function route(){
  const [id, chap, tab] = decodeURIComponent(currentHash.replace(/^#/, "")).split("/");
  const c = id ? CONTENU[id] : null;
  if (id && findMat(id) && c && chap && c.chapitres.some(x => x.id === chap)){
    state.course = id; state.chap = chap;
    state.tab = tab === "train" || !tab ? "train" : "docs";
    show("viewCourse"); renderCourse();
  } else if (id && findMat(id)){
    state.course = id; state.chap = "all";
    document.body.style.removeProperty("--cc");
    show("viewMatiere"); renderMatiere();
  } else {
    state.course = null; state.chap = "all";
    document.body.style.removeProperty("--acc"); document.body.style.removeProperty("--cc");
    show("viewHome"); renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { try { if (location.hash !== currentHash){ currentHash = location.hash; route(); } } catch(e){} });
route();
</script>
